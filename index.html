const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();
let audioInitialized = false;

function initAudio() {
    if (!audioInitialized) { audioCtx.resume(); audioInitialized = true; document.getElementById('startOverlay').style.display = 'none'; }
}
window.addEventListener('click', initAudio);
window.addEventListener('keydown', initAudio);

function playTone(freq, duration, type = 'sine', volume = 0.1) {
    if (!audioInitialized) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playNoise(duration, volume = 0.1) {
    if (!audioInitialized) return;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    noise.connect(gain); gain.connect(audioCtx.destination); noise.start();
}
function playBeamSound(duration) {
    if (!audioInitialized) return;
    const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc1.type = 'sawtooth'; osc2.type = 'square';
    osc1.frequency.setValueAtTime(220, audioCtx.currentTime); osc1.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + duration);
    osc2.frequency.setValueAtTime(440, audioCtx.currentTime); osc2.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(); osc2.start(); osc1.stop(audioCtx.currentTime + duration); osc2.stop(audioCtx.currentTime + duration);
}

function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}
function worldToScreen(worldY) { return worldY - cameraY; }
function isBouncyStage() { return !!(STAGES[stageIdx] && STAGES[stageIdx].bouncy); }
function triggerScreenShake(intensity, duration) { screenShakeIntensity = intensity; screenShakeDuration = duration; }
function updateScreenShake() {
    if (screenShakeDuration > 0) {
        screenShakeX = (Math.random() * 2 - 1) * screenShakeIntensity;
        screenShakeY = (Math.random() * 2 - 1) * screenShakeIntensity;
        screenShakeDuration--;
    } else { screenShakeX = 0; screenShakeY = 0; }
}

function handleCharCreateInput(code) {
    if (state !== "char_create") return;
    
    if (ccSection === 0) {
        if (code === 'ArrowDown' || code === 'KeyS') { ccSection = 1; sounds.menu_select(); }
        else if (code === 'Backspace') {
            if (customChar.name.length > 0 && ccNameCursor > 0) {
                customChar.name = customChar.name.slice(0, ccNameCursor - 1) + customChar.name.slice(ccNameCursor);
                ccNameCursor--;
            }
        } else if (code === 'ArrowLeft' || code === 'KeyA') {
            if (ccNameCursor > 0) ccNameCursor--;
        } else if (code === 'ArrowRight' || code === 'KeyD') {
            if (ccNameCursor < customChar.name.length) ccNameCursor++;
        } else if (code.startsWith('Key') && code.length === 4 && customChar.name.length < 12) {
            const char = code.charAt(3);
            customChar.name = customChar.name.slice(0, ccNameCursor) + char + customChar.name.slice(ccNameCursor);
            ccNameCursor++;
        }
    } else if (ccSection === 1) {
        if (code === 'ArrowUp' || code === 'KeyW') { ccSection = 0; sounds.menu_select(); }
        else if (code === 'ArrowDown' || code === 'KeyS') { ccSection = 2; sounds.menu_select(); }
        else if (code === 'ArrowLeft' || code === 'KeyA') {
            customChar.colorIdx = (customChar.colorIdx - 1 + PRESET_COLORS.length) % PRESET_COLORS.length;
            customChar.useCustomColor = false;
            sounds.menu_select();
        } else if (code === 'ArrowRight' || code === 'KeyD') {
            customChar.colorIdx = (customChar.colorIdx + 1) % PRESET_COLORS.length;
            customChar.useCustomColor = false;
            sounds.menu_select();
        }
    } else if (ccSection === 2) {
        if (code === 'ArrowUp' || code === 'KeyW') { ccSection = 1; sounds.menu_select(); }
        else if (code === 'ArrowDown' || code === 'KeyS') { ccSection = 3; sounds.menu_select(); }
        else if (code === 'ArrowLeft' || code === 'KeyA') {
            customChar.useCustomColor = true;
            const k = ['r','g','b'][ccStatIdx % 3];
            customChar.customColor[k] = Math.max(0, customChar.customColor[k] - 10);
            customChar.customDark[k] = Math.max(0, Math.floor(customChar.customColor[k] * 0.6));
        } else if (code === 'ArrowRight' || code === 'KeyD') {
            customChar.useCustomColor = true;
            const k = ['r','g','b'][ccStatIdx % 3];
            customChar.customColor[k] = Math.min(255, customChar.customColor[k] + 10);
            customChar.customDark[k] = Math.max(0, Math.floor(customChar.customColor[k] * 0.6));
        } else if (code === 'Tab' || code === 'KeyQ' || code === 'KeyE') {
            ccStatIdx = (ccStatIdx + 1) % 3;
            sounds.menu_select();
        }
    } else if (ccSection === 3) {
        if (code === 'ArrowUp' || code === 'KeyW') { ccSection = 2; sounds.menu_select(); }
        else if (code === 'ArrowDown' || code === 'KeyS') { ccSection = 4; sounds.menu_select(); }
        else if (code === 'ArrowLeft' || code === 'KeyA') {
            customChar.sizeIdx = (customChar.sizeIdx - 1 + SIZE_OPTIONS.length) % SIZE_OPTIONS.length;
            sounds.menu_select();
        } else if (code === 'ArrowRight' || code === 'KeyD') {
            customChar.sizeIdx = (customChar.sizeIdx + 1) % SIZE_OPTIONS.length;
            sounds.menu_select();
        }
    } else if (ccSection === 4) {
        if (code === 'ArrowUp' || code === 'KeyW') {
            if (ccStatIdx > 0) ccStatIdx--;
            else ccSection = 3;
            sounds.menu_select();
        } else if (code === 'ArrowDown' || code === 'KeyS') {
            if (ccStatIdx < 3) ccStatIdx++;
            else ccSection = 5;
            sounds.menu_select();
        } else if (code === 'ArrowLeft' || code === 'KeyA') {
            const statKey = ['health', 'speed', 'damage', 'jump'][ccStatIdx];
            if (customChar.stats[statKey] > STAT_CONFIG[statKey].min) {
                customChar.stats[statKey]--;
                sounds.menu_select();
            }
        } else if (code === 'ArrowRight' || code === 'KeyD') {
            const statKey = ['health', 'speed', 'damage', 'jump'][ccStatIdx];
            const totalUsed = Object.values(customChar.stats).reduce((a, b) => a + b, 0);
            if (customChar.stats[statKey] < STAT_CONFIG[statKey].max && totalUsed < STAT_POINTS_TOTAL) {
                customChar.stats[statKey]++;
                sounds.menu_select();
            }
        }
    } else if (ccSection === 5) {
        if (code === 'ArrowUp' || code === 'KeyW') { ccSection = 4; sounds.menu_select(); }
        else if (code === 'KeyF' || code === 'KeyK' || code === 'Enter' || code === 'Space') {
            sounds.menu_confirm();
            state = "select";
        }
    }
}

function getCurrentColor() {
    if (customChar.useCustomColor) {
        return { color: rgb(customChar.customColor.r, customChar.customColor.g, customChar.customColor.b),
                 dark: rgb(customChar.customDark.r, customChar.customDark.g, customChar.customDark.b) };
    }
    return PRESET_COLORS[customChar.colorIdx];
}

function getStatMultipliers() {
    const size = SIZE_OPTIONS[customChar.sizeIdx];
    return {
        health: size.healthMult * (1 + customChar.stats.health * STAT_CONFIG.health.perPoint),
        speed: size.speedMult * (1 + customChar.stats.speed * STAT_CONFIG.speed.perPoint),

    // --- DEATH METHOD ---
    die(fl) {
        if (this.isDead) return;
        this.isDead = true;
        this.health = 0;
        this.deathTimer = this.deathMaxTimer;
        const dir = fl ? 1 : -1;
        this.deathVelX = dir * (3 + Math.random() * 5);
        this.deathVelY = -7 - Math.random() * 5;
        this.deathRotSpeed = dir * (0.06 + Math.random() * 0.12);
        this.weapon = null;
        this.armor = null;
        this.firing_ray = false;
        this.aerial_combo_timer = 0;
        this.combo_trail = [];
        
        // Spawn death particles
        for (let i = 0; i < 8; i++) {
            debris.push(new Debris(
                this.x + (Math.random() - 0.5) * 20,
                this.y - this.height * 0.5 + (Math.random() - 0.5) * 30,
                this.color
            ));

    // --- DEATH PHYSICS ---
    updateDeath() {
        if (!this.isDead) return;
        if (this.deathTimer <= 0) return;
        
        this.deathTimer--;
        
        if (!this.deathLanded) {
            this.deathVelY += BASE_GRAVITY;
            this.x += this.deathVelX;
            this.y += this.deathVelY;
            this.deathRotation += this.deathRotSpeed;
            this.deathVelX *= 0.995;
            
            // Check platform collision
            for (const p of platforms) {
                const prevY = this.y - this.deathVelY;
                if (prevY <= p.y && this.y >= p.y && this.x >= p.x - 10 && this.x <= p.x + p.w + 10 && this.deathVelY >= 0) {
                    this.y = p.y;
                    this.deathVelY = 0;
                    this.deathVelX = 0;
                    this.deathRotSpeed = 0;
                    // Snap to lying down angle
                    if (this.deathRotation >= 0) {
                        this.deathRotation = Math.PI / 2 + (Math.random() - 0.5) * 0.4;
                    } else {
                        this.deathRotation = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
                    }
                    this.deathLanded = true;
                    // Generate random death pose
                    this.deathPose = {
                        a1x: -8 + Math.random() * 6, a1y: -22 + Math.random() * 8,
                        a2x: 10 + Math.random() * 8, a2y: -20 + Math.random() * 8,
                        l1x: -45 + Math.random() * 10, l1y: -14 + Math.random() * 8,
                        l2x: -52 + Math.random() * 10, l2y: 4 + Math.random() * 10
                    };
                    sounds.death_land();
                    // Small landing debris
                    for (let i = 0; i < 4; i++) {
                        debris.push(new Debris(this.x + (Math.random() - 0.5) * 30, this.y, rgb(110, 90, 70)));
                    }
                    break;
                }
            }
            
            // Check lava/hazard
            if (!this.deathLanded && this.y >= currentLavaY) {
                this.y = currentLavaY;
                this.deathVelY = 0;
                this.deathVelX = 0;
                this.deathRotSpeed = 0;
                if (this.deathRotation >= 0) {
                    this.deathRotation = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
                } else {
                    this.deathRotation = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
                }
                this.deathLanded = true;
                this.deathPose = {
                    a1x: -8 + Math.random() * 6, a1y: -22 + Math.random() * 8,
                    a2x: 10 + Math.random() * 8, a2y: -20 + Math.random() * 8,
                    l1x: -45 + Math.random() * 10, l1y: -14 + Math.random() * 8,
                    l2x: -52 + Math.random() * 10, l2y: 4 + Math.random() * 10
                };
                sounds.death_land();
            }
            
            // Clamp to screen sides
            if (this.x < 10) { this.x = 10; this.deathVelX = Math.abs(this.deathVelX) * 0.3; }
            if (this.x > WIDTH - 10) { this.x = WIDTH - 10; this.deathVelX = -Math.abs(this.deathVelX) * 0.3; }
        }
    }
    
    // --- DEAD BODY & GHOST DRAWING ---
    drawDead(ctx) {
        if (this.deathTimer <= 0) return;
        
        const alpha = Math.min(1, this.deathTimer / 60);
        const sy = worldToScreen(this.y);
        if (sy < -200 || sy > HEIGHT + 200) return;
        const s = this.statMods.sizeScale;
        
        // --- GHOST RISING EFFECT ---
        if (this.deathTimer > 120) { // First 3 seconds
            const ghostTime = this.deathMaxTimer - this.deathTimer;
            const ghostProgress = Math.min(1, ghostTime / 100); // Rises over ~1.6 seconds
            
            // Pop and stretch effect
            const popScale = ghostProgress < 0.15 ? ghostProgress / 0.15 : 1;
            const stretch = 1 + ghostProgress * 0.6;
            const ghostAlpha = Math.max(0, (1 - ghostProgress * 0.8) * 0.85); // Stays visible longer
            const ghostRise = ghostProgress * 140; // Rises higher
            const wobble = Math.sin(ghostTime * 0.12) * 12;
            
            ctx.save();
            ctx.globalAlpha = ghostAlpha;
            
            // Ethereal glow matching player color
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 25 * s;
            
            ctx.strokeStyle = rgb(230, 245, 255);
            ctx.fillStyle = rgba(210, 235, 255, 0.4);
            ctx.lineWidth = 2.5 * s;
            
            const gx = this.x + wobble;
            const gy = sy - ghostRise;
            
            ctx.save();
            ctx.translate(gx, gy);
            
            // Wisp trail below
            ctx.fillStyle = rgba(210, 235, 255, 0.3);
            ctx.beginPath();
            ctx.arc(-wobble * 0.5, 35*s, 9*s, 0, Math.PI*2);
            ctx.arc(wobble * 0.3, 55*s, 7*s, 0, Math.PI*2);
            ctx.arc(-wobble * 0.2, 75*s, 5*s, 0, Math.PI*2);
            ctx.fill();
            
            ctx.scale(popScale, popScale * stretch);
            
            // Ghost body shape
            ctx.beginPath();
            ctx.arc(0, -55*s, 16*s, Math.PI, 0); // Top dome
            ctx.lineTo(16*s, -40*s);
            // Wavy bottom
            ctx.quadraticCurveTo(8*s, -25*s, 0, -40*s);
            ctx.quadraticCurveTo(-8*s, -55*s, -16*s, -40*s);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Ghost face (surprised/scared)
            const eyeDir = this.facing * 2.5 * s;
            ctx.fillStyle = rgb(80, 130, 180);
            ctx.shadowBlur = 0;
            
            // Wide eyes
            ctx.beginPath();
            ctx.ellipse(-7*s + eyeDir, -58*s, 4*s, 5*s, 0, 0, Math.PI*2);
            ctx.ellipse(7*s + eyeDir, -58*s, 4*s, 5*s, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Pupils
            ctx.fillStyle = rgb(255, 255, 255);
            ctx.beginPath();
            ctx.arc(-6*s + eyeDir, -59*s, 2*s, 0, Math.PI*2);
            ctx.arc(8*s + eyeDir, -59*s, 2*s, 0, Math.PI*2);
            ctx.fill();
            
            // "O" mouth
            ctx.fillStyle = rgb(80, 130, 180);
            ctx.beginPath();
            ctx.arc(0, -45*s, 4.5*s, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
            ctx.restore();
            
            // "Soul pop" particles when ghost first emerges
            if (ghostTime < 20 && ghostTime % 4 === 0) {
                for (let i = 0; i < 3; i++) {
                    debris.push(new Debris(
                        this.x + (Math.random() - 0.5) * 30 * s,
                        sy - 30 * s + (Math.random() - 0.5) * 20,
                        rgb(200, 230, 255)
                    ));
                }
            }
        }
        
        // Blood pool on ground
        if (this.deathLanded) {
            ctx.save();
            ctx.globalAlpha = alpha * 0.4;
            ctx.fillStyle = rgb(130, 15, 15);
            ctx.beginPath();
            ctx.ellipse(this.x, sy + 2, 24*s, 5*s, 0, 0, Math.PI*2);
            ctx.fill();
            // Smaller splats
            ctx.fillStyle = rgb(160, 20, 20);
            ctx.globalAlpha = alpha * 0.3;
            for (let i = 0; i < 3; i++) {
                const sx2 = this.x + Math.sin(i * 2.3) * 20 * s;
                const sy2 = sy + Math.cos(i * 1.7) * 3;
                ctx.beginPath();
                ctx.ellipse(sx2, sy2, 5*s, 2*s, i * 0.5, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }
        
        // Dead body
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(this.x, sy);
        ctx.rotate(this.deathRotation);
        
        const bodyColor = this.darkColor;
        ctx.strokeStyle = bodyColor;
        ctx.fillStyle = bodyColor;
        
        // Torso (body is horizontal when lying down)
        ctx.lineWidth = 5*s;
        ctx.beginPath();
        ctx.moveTo(-28*s, 0);  // hip
        ctx.lineTo(8*s, 0);    // shoulder
        ctx.stroke();
        
        // Head
        ctx.beginPath();
        ctx.arc(22*s, 0, 13*s, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = BLACK;
        ctx.lineWidth = 1.5*s;
        ctx.stroke();
        
        // X Eyes (red)
        ctx.strokeStyle = rgb(200, 30, 30);
        ctx.lineWidth = 2.5*s;
        const ex = 26*s;
        const ey1 = -4*s, ey2 = 4*s;
        const xs = 3.5*s;
        ctx.beginPath();
        // Top eye X
        ctx.moveTo(ex - xs, ey1 - xs); ctx.lineTo(ex + xs, ey1 + xs);
        ctx.moveTo(ex + xs, ey1 - xs); ctx.lineTo(ex - xs, ey1 + xs);
        // Bottom eye X
        ctx.moveTo(ex - xs, ey2 - xs); ctx.lineTo(ex + xs, ey2 + xs);
        ctx.moveTo(ex + xs, ey2 - xs); ctx.lineTo(ex - xs, ey2 + xs);
        ctx.stroke();
        
        // Tongue sticking out
        ctx.fillStyle = rgb(200, 60, 80);
        ctx.beginPath();
        ctx.ellipse(34*s, 2*s, 4*s, 2.5*s, 0.2, 0, Math.PI*2);
        ctx.fill();
        
        // Arms (using death pose or defaults)
        const p = this.deathPose || {a1x:-5,a1y:-18,a2x:12,a2y:-16,l1x:-48,l1y:-10,l2x:-52,l2y:6};
        ctx.strokeStyle = bodyColor;
        ctx.lineWidth = 4*s;
        ctx.beginPath();
        ctx.moveTo(3*s, 0);
        ctx.lineTo(p.a1x*s, p.a1y*s);
        ctx.moveTo(3*s, 0);
        ctx.lineTo(p.a2x*s, p.a2y*s);
        ctx.stroke();
        
        // Hands (small circles)
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.arc(p.a1x*s, p.a1y*s, 3*s, 0, Math.PI*2);
        ctx.arc(p.a2x*s, p.a2y*s, 3*s, 0, Math.PI*2);
        ctx.fill();
        
        // Legs
        ctx.strokeStyle = bodyColor;
        ctx.lineWidth = 5*s;
        ctx.beginPath();
        ctx.moveTo(-28*s, 0);
        ctx.lineTo(p.l1x*s, p.l1y*s);
        ctx.moveTo(-28*s, 0);
        ctx.lineTo(p.l2x*s, p.l2y*s);
        ctx.stroke();
        
        // Feet
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.arc(p.l1x*s, p.l1y*s, 3.5*s, 0, Math.PI*2);
        ctx.arc(p.l2x*s, p.l2y*s, 3.5*s, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore();
    }
    
    handleInput(wList, aList, aRows, bList, keySource) {
        if (this.isDead || this.health <= 0) return;
        if (this.hit_stun > 0) { this.hit_stun--; this.moving = false; return; }
        const c = this.controls; this.moving = false;
        const speed = BASE_MOVE_SPEED * this.statMods.speed;
        if (this.aerial_combo_timer > 0) { if(keySource[c.left]){this.x-=speed*0.4;this.facing=-1;} if(keySource[c.right]){this.x+=speed*0.4;this.facing=1;} this.x=Math.max(this.width,Math.min(WIDTH-this.width,this.x)); this.tryPickupWeapon(wList); this.tryPickupArmor(aList); return; }
        if (this.firing_ray) { if(keySource[c.left]) this.facing=-1; if(keySource[c.right]) this.facing=1; this.tryPickupWeapon(wList); this.tryPickupArmor(aList); return; }
        if (keySource[c.left]) { this.x -= speed; this.facing = -1; this.moving = true; }
        if (keySource[c.right]) { this.x += speed; this.facing = 1; this.moving = true; }
        this.x = Math.max(this.width, Math.min(WIDTH - this.width, this.x));
        if (keySource[c.jump] && this.on_ground) { this.vel_y = BASE_JUMP_STRENGTH * this.statMods.jump; this.on_ground = false; }
        if (keySource[c.aerial] && !this.on_ground) { if(this.startAerialCombo()){this.tryPickupWeapon(wList);this.tryPickupArmor(aList);return;} }
        if (keySource[c.super] && this.isSuperReady()) { if(this.fireSuperRay()){this.tryPickupWeapon(wList);this.tryPickupArmor(aList);return;} }
        if (this.punch_cd === 0 && keySource[c.punch]) {
            if (this.isReloading()) {}
            else if (this.weapon && (this.weapon.type==="bomb"||this.weapon.type==="nuke")) { this.attack_type="throw"; this.attack_anim=15; this.throwBomb(bList); }
            else if (this.isRanged()) { if(this.weapon.current_mag<=0){this.startReload();sounds.empty_click();}else{this.attack_type="shoot";this.attack_anim=10;this.shoot(aRows);this.weapon.durability--;if(this.weapon.durability<=0){this.weapon=null;sounds.break();}} }
            else if (this.weapon) { this.attack_type="weapon"; this.attack_anim=12; }
            else { this.attack_type="punch"; this.attack_anim=10; }
            this.punch_cd = this.currentStats().cooldown;
        }
        if (this.kick_cd === 0 && keySource[c.kick]) { this.attack_type="kick"; this.attack_anim=14; this.kick_cd=KICK_COOLDOWN; }
        this.tryPickupWeapon(wList); this.tryPickupArmor(aList);
    }
    physics() {
        if (this.isDead) { this.updateDeath(); return; }
        if (this.health <= 0) return;
        this.vel_y += BASE_GRAVITY; this.y += this.vel_y; this.on_ground = false;
        for (const p of platforms) {
            const py=this.y-this.vel_y;
            if(py<=p.y&&this.y>=p.y&&p.x<=this.x&&this.x<=p.x+p.w&&this.vel_y>=0){
                this.y=p.y;
                if (isBouncyStage()) {
                    const bounceVel = -this.vel_y * SLIME_BOUNCE_FACTOR;
                    if (bounceVel < -SLIME_MIN_BOUNCE_VEL) {
                        this.vel_y = Math.max(bounceVel, BASE_JUMP_STRENGTH * 1.7 * this.statMods.jump);
                        this.on_ground = false;
                        this.bounceSquish = 8;
                        if (this.bounceCd <= 0) { sounds.slime_bounce(); this.bounceCd = 8; }
                    } else {
                        this.vel_y = 0;
                        this.on_ground = true;
                    }
                } else {
                    this.vel_y = 0;
                    this.on_ground = true;
                }
                break;
            }
        }
        if (this.on_ground && this.aerial_combo_timer > 0) { this.aerial_combo_timer=0; this.attack_type=null; this.attack_anim=0; this.combo_trail=[]; }
        if (!this.on_ground && this.y >= currentLavaY) this.hazardHit();
        if (this.punch_cd > 0) this.punch_cd--;
        if (this.kick_cd > 0) this.kick_cd--;
        if (this.bounceCd > 0) this.bounceCd--;
        if (this.bounceSquish > 0) this.bounceSquish--;
        if (this.aerial_combo_cd > 0) this.aerial_combo_cd--;
        if (this.aerial_combo_timer > 0) {
            this.aerial_combo_timer--;
            this.combo_trail.push({x:this.x,y:this.y-this.height*0.5,life:15,maxLife:15,rotation:(AERIAL_COMBO_DURATION-this.aerial_combo_timer)*25});
            this.combo_trail = this.combo_trail.filter(t => { t.life--; return t.life > 0; });
            if (this.aerial_combo_timer === 0) { this.attack_type=null; this.attack_anim=0; this.combo_trail=[]; if(this.aerial_combo_hits_landed>0) comboTexts.push({x:this.x,y:this.y-this.height-20,text:this.aerial_combo_hits_landed>=3?"3-HIT COMBO!":`${this.aerial_combo_hits_landed} HIT!`,life:60,color:this.aerial_combo_hits_landed>=3?COMBO_ORANGE:YELLOW}); this.aerial_combo_hits_landed=0; }
        }
        if (this.armor_flash > 0) this.armor_flash--;
        if (this.super_cooldown > 0) this.super_cooldown--;
        if (this.super_flash > 0) this.super_flash--;
        if (this.radiation_flash > 0) this.radiation_flash--;
        if (this.reload_timer > 0) { this.reload_timer--; if(this.reload_timer===0&&this.weapon) this.weapon.current_mag=WEAPON_TYPES[this.weapon.type].mag_size||0; }
        if (this.firing_ray) { if(this.attack_anim>0) this.attack_anim--; if(this.attack_anim===0){this.firing_ray=false;this.attack_type=null;} }
        else if (this.attack_anim > 0 && this.aerial_combo_timer === 0) { this.attack_anim--; if(this.attack_anim===0) this.attack_type=null; }
        if (this.moving && this.on_ground) this.walk_cycle += 0.25; else this.walk_cycle = 0;
    }
    registerWeaponHit() { if(this.weapon){this.weapon.durability--;if(this.weapon.durability<=0){this.weapon=null;sounds.break();}} }
    addSuperCharge(a) { const w=this.super_charge>=MAX_SUPER_CHARGE; this.super_charge=Math.min(MAX_SUPER_CHARGE,this.super_charge+a); if(!w&&this.super_charge>=MAX_SUPER_CHARGE) sounds.super_charge(); }
    takeHit(d, fl) {
        if(this.health<=0) return;
        if(this.armor){const i=ARMOR_TYPES[this.armor.type];const ab=Math.min(d,i.absorb);d-=ab;this.armor.durability--;this.armor_flash=10;if(this.armor.durability<=0){this.armor=null;sounds.break();}}
        this.health=Math.max(0,this.health-d);
        if (this.health <= 0) { this.die(fl); return; }
        this.hit_stun=HIT_STUN;
        const push = (fl ? 8 : -8) * this.statMods.sizeScale;
        this.x=Math.max(this.width,Math.min(WIDTH-this.width,this.x+push));

    hazardHit() {
        if(this.health<=0) return;
        this.health=Math.max(0,this.health-HAZARD_DAMAGE);
        if (this.health <= 0) { this.die(Math.random() > 0.5); return; }
        this.hit_stun=HAZARD_STUN;
        const sp=platforms.filter(p=>p.y<currentLavaY-20);

function handleMenuInput(code) {
    if(state==="mode_select"){
        if(code==='ArrowUp'||code==='KeyW')modeIdx=(modeIdx-1+MODE_CHOICES.length)%MODE_CHOICES.length;
        else if(code==='ArrowDown'||code==='KeyS')modeIdx=(modeIdx+1)%MODE_CHOICES.length;
        else if(code==='KeyF'||code==='KeyK'||code==='Enter'||code==='Space'){
            gameMode=["1v1","1v2","1v3","multi"][modeIdx];
            sounds.menu_confirm();
            state="char_create";
        }
    }
    else if(state==="select"){
        if(!p1Ready){
            if(code==='KeyA')p1Idx=(p1Idx-1+WEAPON_CHOICES.length)%WEAPON_CHOICES.length;
            else if(code==='KeyD')p1Idx=(p1Idx+1)%WEAPON_CHOICES.length;
            else if(code==='KeyF')p1Ready=true;
        }
    }
    else if(state==="world_select"&&!worldLocked){
        if(code==='KeyA'||code==='ArrowLeft')stageIdx=(stageIdx-1+STAGES.length)%STAGES.length;
        else if(code==='KeyD'||code==='ArrowRight')stageIdx=(stageIdx+1)%STAGES.length;
        else if(code==='KeyF'||code==='KeyK'||code==='Enter'||code==='Space')worldLocked=true;
    }
    else if(state==="over"&&code==='KeyR'){
        const now = Date.now();
        if (now - lastRPressTime < R_DOUBLE_PRESS_WINDOW) {
            state = "mode_select";
            p1Idx = 0;
            p1Ready = false;
            sounds.menu_confirm();
        } else {
            state = "char_create";
            sounds.menu_select();
        }
        lastRPressTime = now;
    }
}

function drawBackground(c,s){
    const g=c.createLinearGradient(0,0,0,HEIGHT);g.addColorStop(0,s.sky_top);g.addColorStop(1,s.sky_bottom);c.fillStyle=g;c.fillRect(0,0,WIDTH,HEIGHT);
    if(s.decor==="volcano"){c.fillStyle=rgb(70,40,35);c.beginPath();c.moveTo(WIDTH*0.7,worldToScreen(GROUND_Y));c.lineTo(WIDTH*0.82,worldToScreen(120));c.lineTo(WIDTH*0.94,worldToScreen(GROUND_Y));c.fill();c.fillStyle=rgb(230,90,30);c.beginPath();c.moveTo(WIDTH*0.79,worldToScreen(200));c.lineTo(WIDTH*0.82,worldToScreen(130));c.lineTo(WIDTH*0.85,worldToScreen(200));c.fill();}
    if(s.decor==="slime"){
        c.fillStyle=rgba(150,240,120,0.25);
        for(let i=0;i<18;i++){const bx=(i*173+37)%WIDTH;const bob=Math.sin(Date.now()*0.002+i)*8;const by=((i*97)+bob+HEIGHT*2)%HEIGHT;const r=6+(i%5)*3;c.beginPath();c.arc(bx,by,r,0,Math.PI*2);c.fill();}
    }
    const hazardColor = s.hazard_color || rgb(40,10,8);
    const hazardBubbleColor = s.hazard_bubble_color || rgb(240,110,30);
    const sly=worldToScreen(currentLavaY);
    c.fillStyle=hazardColor;c.fillRect(0,sly,WIDTH,HEIGHT-sly);
    c.fillStyle=hazardBubbleColor;
    for(let gx=0;gx<WIDTH;gx+=26){const wobbleSpeed=s.decor==="slime"?0.1:0.15;const timeShift=s.decor==="slime"?Date.now()*0.002:0;const w=Math.sin((gx+40)*wobbleSpeed+timeShift)*4;c.beginPath();c.arc(gx+13,sly+55+w,9,0,Math.PI*2);c.fill();}
    for(const p of platforms){
        const sy=worldToScreen(p.y);if(sy<-50||sy>HEIGHT+50)continue;
        const an=platformSpawnAnims.find(a=>a.plat===p);
        if(an){const pr=1-(an.frames/25);c.fillStyle=rgba(255,255,150,0.7*pr);c.fillRect(p.x-12+(1-pr)*12,sy-12+(1-pr)*12,p.w+24,p.h+24);}
        if(s.decor==="slime"){
            const wob=Math.sin(Date.now()*0.0035+p.x*0.04)*3;
            c.fillStyle=s.ground;
            c.beginPath();
            c.moveTo(p.x,sy+p.h);
            c.lineTo(p.x,sy+wob+4);
            c.quadraticCurveTo(p.x+p.w*0.25,sy-5+wob,p.x+p.w*0.5,sy+wob);
            c.quadraticCurveTo(p.x+p.w*0.75,sy+5+wob,p.x+p.w,sy+wob+4);
            c.lineTo(p.x+p.w,sy+p.h);
            c.closePath();
            c.fill();
            c.fillStyle=rgba(255,255,255,0.35);
            c.beginPath();c.ellipse(p.x+p.w*0.3,sy+wob+3,p.w*0.14,3.5,0,0,Math.PI*2);c.fill();
            c.fillStyle=s.ground_edge;
            c.beginPath();c.arc(p.x+p.w*0.18,sy+wob+2,6,0,Math.PI*2);c.fill();
            c.beginPath();c.arc(p.x+p.w*0.82,sy+wob+2,5,0,Math.PI*2);c.fill();
            c.beginPath();c.arc(p.x+p.w*0.5,sy+p.h+4+Math.max(0,Math.sin(Date.now()*0.003+p.x)*3),3,0,Math.PI*2);c.fill();
        } else {
            c.fillStyle=s.ground;c.fillRect(p.x,sy,p.w,p.h);
            c.fillStyle=s.ground_edge;c.fillRect(p.x,sy,p.w,10);
        }
    }
}

function drawHUD(c){const bw=Math.min(280,WIDTH*0.22),bh=22;const pos=[{x:20,y:20,a:'left'},{x:WIDTH-20-bw,y:20,a:'right'},{x:20,y:80,a:'left'},{x:WIDTH-20-bw,y:80,a:'right'}];for(let i=0;i<fighters.length;i++){const f=fighters[i],p=pos[i],r=f.health/f.maxHealth;c.fillStyle=BLACK;c.fillRect(p.x,p.y,bw,bh);c.fillStyle=r>0.5?GREEN:(r>0.25?YELLOW:RED);const fw=(bw-6)*r;c.fillRect(p.a==='left'?p.x+3:p.x+bw-3-fw,p.y+3,fw,bh-6);c.fillStyle=f.color;c.font="bold 14px Arial";c.textAlign=p.a;c.fillText(f.name+(f.isDead?" 💀":""),p.a==='left'?p.x:p.x+bw,p.y-4);const sr=f.super_charge/MAX_SUPER_CHARGE;c.fillStyle=BLACK;c.fillRect(p.x,p.y+bh+4,bw,8);if(sr>0){c.fillStyle=sr>=1?PURPLE:rgb(80,40,120);const sw=(bw-4)*sr;c.fillRect(p.a==='left'?p.x+2:p.x+bw-2-sw,p.y+bh+6,sw,4);}c.fillStyle=WHITE;c.font="bold 12px Arial";c.textAlign=p.a;c.fillText(`Wins: ${wins[i]}`,p.a==='left'?p.x:p.x+bw,p.y+bh+24);}c.fillStyle=WHITE;c.font="bold 24px Arial";c.textAlign="center";c.fillText(fighters.map(f=>f.health>0?"●":"○").join(" "),WIDTH/2,30);if(lavaRiseWarning>0&&Math.floor(lavaRiseWarning/5)%2===0){c.fillStyle=RED;c.font="bold 24px Arial";c.textAlign="center";c.fillText("WARNING: LAVA RISING!",WIDTH/2,HEIGHT/2-50);}if(radiationClouds.length>0&&!gameOver){c.fillStyle=TOXIC_GREEN;c.font="bold 14px Arial";c.textAlign="center";c.fillText("☢ TOXIC FALLOUT ACTIVE ☢",WIDTH/2,90);}if(STAGES[stageIdx]&&STAGES[stageIdx].bouncy&&!gameOver){c.fillStyle=rgb(120,230,90);c.font="bold 14px Arial";c.textAlign="center";c.fillText("🟢 SLIME WORLD - BOUNCE OFF PLATFORMS! 🟢",WIDTH/2,110);} }

function update() {
    if(state==="mode_select"||state==="char_create")return;
    if(state==="select"){if(p1Ready){selectConfirmTimer++;if(selectConfirmTimer>45){selectConfirmTimer=0;worldLocked=false;worldConfirmTimer=0;state="world_select";}}return;}
    if(state==="world_select"){if(worldLocked){worldConfirmTimer++;if(worldConfirmTimer>45){resetFighters();gameOver=false;winner=null;spawnTimer=WEAPON_SPAWN_INTERVAL;armorSpawnTimer=ARMOR_SPAWN_INTERVAL;fireballSpawnTimer=Math.random()*(FIREBALL_SPAWN_MAX-FIREBALL_SPAWN_MIN)+FIREBALL_SPAWN_MIN;worldConfirmTimer=0;state="playing";}}return;}
    
    // Always update dead bodies (even after game over so death animations finish)
    for (const f of fighters) {
        if (f.isDead) f.updateDeath();
    }
    
    if(!gameOver){
        for(let i=0;i<fighters.length;i++){if(fighters[i].isAI)updateAIFor(fighters[i],i-1);}
        for(let i=0;i<fighters.length;i++){fighters[i].handleInput(weapons,armors,arrows,bombs,fighters[i].isAI?aiKeysPool[i-1]:keys);}
        for(const f of fighters) if (!f.isDead) f.physics();
        checkHits();checkAerialComboHits();updateArrows();
        asteroidSpawnTimer--;
        if (asteroidSpawnTimer <= 0) { spawnAsteroidWave(); asteroidSpawnTimer = Math.floor(Math.random() * (ASTEROID_SPAWN_MAX - ASTEROID_SPAWN_MIN)) + ASTEROID_SPAWN_MIN; }
        for (let i = asteroidWarnings.length - 1; i >= 0; i--) { if (!asteroidWarnings[i].update()) asteroidWarnings.splice(i, 1); }
        for (let i = asteroids.length - 1; i >= 0; i--) { asteroids[i].update(); if (asteroids[i].dead) asteroids.splice(i, 1); }
        for (let i = asteroidImpacts.length - 1; i >= 0; i--) { asteroidImpacts[i].update(); if (asteroidImpacts[i].life <= 0) asteroidImpacts.splice(i, 1); }
        for(let i=superRays.length-1;i>=0;i--){superRays[i].update();if(superRays[i].life<=0)superRays.splice(i,1);}
        for(let i=bombs.length-1;i>=0;i--){bombs[i].update();if(bombs[i].exploded){const r=bombs[i].explode();if(bombs[i].isNuke){nukeExplosions.push(r[0]);radiationClouds.push(r[1]);}else explosions.push(r);bombs.splice(i,1);}}
        for(let i=explosions.length-1;i>=0;i--){explosions[i].update();if(explosions[i].life<=0)explosions.splice(i,1);}
        for(let i=nukeExplosions.length-1;i>=0;i--){nukeExplosions[i].update();if(nukeExplosions[i].life<=0)nukeExplosions.splice(i,1);}
        for(let i=radiationClouds.length-1;i>=0;i--){radiationClouds[i].update();if(radiationClouds[i].life<=0)radiationClouds.splice(i,1);}
        const stage=STAGES[stageIdx];
        if(stage.decor==="volcano"){fireballSpawnTimer--;if(fireballSpawnTimer<=0){spawnFireball();fireballSpawnTimer=Math.random()*(FIREBALL_SPAWN_MAX-FIREBALL_SPAWN_MIN)+FIREBALL_SPAWN_MIN;if(Math.random()<0.3)spawnFireball();}for(let i=fireballs.length-1;i>=0;i--){fireballs[i].update();if(fireballs[i].exploded){fireExplosions.push(fireballs[i].explode());fireballs.splice(i,1);}else if(fireballs[i].dead)fireballs.splice(i,1);}for(let i=fireExplosions.length-1;i>=0;i--){fireExplosions[i].update();if(fireExplosions[i].life<=0)fireExplosions.splice(i,1);}}
        for(let i=debris.length-1;i>=0;i--){debris[i].update();if(debris[i].life<=0)debris.splice(i,1);}
        for(let i=platformSpawnAnims.length-1;i>=0;i--){platformSpawnAnims[i].frames--;if(platformSpawnAnims[i].frames<=0)platformSpawnAnims.splice(i,1);}
        spawnTimer--;if(spawnTimer<=0){spawnWeapon();spawnTimer=WEAPON_SPAWN_INTERVAL;}
        armorSpawnTimer--;if(armorSpawnTimer<=0){spawnArmor();armorSpawnTimer=ARMOR_SPAWN_INTERVAL;}
        lavaRiseTimer--;if(lavaRiseTimer<=120)lavaRiseWarning=120;if(lavaRiseTimer<=0){currentLavaY-=LAVA_RISE_AMOUNT;if(currentLavaY<MIN_PLATFORM_Y-50)currentLavaY=MIN_PLATFORM_Y-50;lavaRiseTimer=LAVA_RISE_INTERVAL;sounds.hazard();generateNewPlatforms();}if(lavaRiseWarning>0)lavaRiseWarning--;
        updateCamera();updateScreenShake();
        for(let i=comboTexts.length-1;i>=0;i--){comboTexts[i].life--;comboTexts[i].y-=1;if(comboTexts[i].life<=0)comboTexts.splice(i,1);}
        for(let i=0;i<fighters.length;i++){for(let j=i+1;j<fighters.length;j++){const a=fighters[i],b=fighters[j];if(a.health<=0||b.health<=0)continue;if(rectIntersect(a.getRect(),b.getRect())){if(a.x<b.x){a.x-=1;b.x+=1;}else{a.x+=1;b.x-=1;}}}}
        const alive=fighters.filter(f=>f.health>0);
        if(alive.length<=1){gameOver=true;state="over";if(alive.length===1){winner=alive[0];wins[alive[0].playerIdx]++;}else winner=null;}
    }
}

function draw() {
    ctx.clearRect(0,0,WIDTH,HEIGHT);
    if(state==="mode_select"){ctx.fillStyle=rgb(20,20,30);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=YELLOW;ctx.font=`bold ${Math.min(48,WIDTH*0.04)}px Arial`;ctx.textAlign="center";ctx.fillText("SELECT GAME MODE",WIDTH/2,HEIGHT*0.2);const bw=Math.min(450,WIDTH*0.35),bh=70,sy=HEIGHT*0.32;for(let i=0;i<MODE_CHOICES.length;i++){const y=sy+i*(bh+20),is=i===modeIdx;ctx.fillStyle=is?rgba(240,200,40,0.2):rgba(255,255,255,0.05);ctx.fillRect(WIDTH/2-bw/2,y,bw,bh);ctx.strokeStyle=is?YELLOW:GRAY;ctx.lineWidth=is?4:2;ctx.strokeRect(WIDTH/2-bw/2,y,bw,bh);ctx.fillStyle=is?YELLOW:WHITE;ctx.font=`bold ${Math.min(28,WIDTH*0.022)}px Arial`;ctx.fillText(MODE_CHOICES[i],WIDTH/2,y+bh/2+8);if(is){ctx.fillText(">",WIDTH/2-bw/2-40,y+bh/2+10);ctx.fillText("<",WIDTH/2+bw/2+20,y+bh/2+10);}}ctx.fillStyle=GRAY;ctx.font=`${Math.min(18,WIDTH*0.014)}px Arial`;ctx.fillText("W/S or Up/Down to navigate, F/K/Enter/Space to confirm",WIDTH/2,HEIGHT*0.9);return;}
    if(state==="char_create"){drawCharCreator(ctx);return;}
    if(state==="select"){ctx.fillStyle=rgb(20,20,20);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=WHITE;ctx.font=`bold ${Math.min(32,WIDTH*0.03)}px Arial`;ctx.textAlign="center";ctx.fillText("CHOOSE YOUR WEAPON",WIDTH/2,80);const cw=Math.min(100,(WIDTH-60)/WEAPON_CHOICES.length),sx=WIDTH/2-(WEAPON_CHOICES.length*cw)/2+cw/2;for(let i=0;i<WEAPON_CHOICES.length;i++){const cx=sx+i*cw;ctx.fillStyle=i===p1Idx?rgba(220,60,60,0.3):rgba(255,255,255,0.1);ctx.fillRect(cx-40,150,80,80);ctx.fillStyle=WHITE;ctx.font="14px Arial";ctx.fillText(WEAPON_CHOICES[i]?WEAPON_CHOICES[i].charAt(0).toUpperCase()+WEAPON_CHOICES[i].slice(1):"Fists",cx,200);if(i===p1Idx){ctx.fillStyle=RED;ctx.fillText("P1",cx,140);}}ctx.fillStyle=p1Ready?GREEN:RED;ctx.fillText(`Player 1: ${p1Ready?"READY!":"A/D choose, F to lock"}`,WIDTH/2,300);ctx.fillStyle=PURPLE;ctx.font="bold 18px Arial";ctx.fillText(`Playing as: ${customChar.name} (${SIZE_OPTIONS[customChar.sizeIdx].name})`,WIDTH/2,340);return;}
    if(state==="world_select"){drawBackground(ctx,STAGES[stageIdx]);ctx.fillStyle=rgba(0,0,0,0.7);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=WHITE;ctx.font=`bold ${Math.min(32,WIDTH*0.03)}px Arial`;ctx.textAlign="center";ctx.fillText("CHOOSE YOUR WORLD",WIDTH/2,80);ctx.fillStyle=YELLOW;ctx.font=`bold ${Math.min(24,WIDTH*0.025)}px Arial`;ctx.fillText(STAGES[stageIdx].name,WIDTH/2,140);ctx.fillStyle=WHITE;ctx.fillText("<",WIDTH/2-100,140);ctx.fillText(">",WIDTH/2+100,140);ctx.fillStyle=worldLocked?GREEN:WHITE;ctx.font="20px Arial";ctx.fillText(worldLocked?"READY!":"A/D or Arrows to browse, F or K to lock in",WIDTH/2,300);if(STAGES[stageIdx].bouncy){ctx.fillStyle=rgb(120,230,90);ctx.font="16px Arial";ctx.fillText("Everything bounces here - platforms, bombs, you!",WIDTH/2,180);}return;}

    ctx.save();ctx.translate(screenShakeX,screenShakeY);
    drawBackground(ctx,STAGES[stageIdx]);
    for (const w of asteroidWarnings) w.draw(ctx);
    for(const w of weapons)w.draw(ctx);for(const a of armors)a.draw(ctx);
    // Draw dead bodies first (behind alive fighters)
    for(const f of fighters) if(f.isDead) f.draw(ctx);
    for(const f of fighters) if(!f.isDead) f.draw(ctx);
    for(const a of arrows)a.draw(ctx);for(const b of bombs)b.draw(ctx);
    for(const e of explosions)e.draw(ctx);for(const e of nukeExplosions)e.draw(ctx);
    for(const r of radiationClouds)r.draw(ctx);
    for(const r of superRays)r.draw(ctx);
    for (const imp of asteroidImpacts) imp.draw(ctx);
    for (const ast of asteroids) ast.draw(ctx);
    for(const f of fireballs)f.draw(ctx);for(const f of fireExplosions)f.draw(ctx);
    for(const d of debris)d.draw(ctx);
    for(const ct of comboTexts){const sy=worldToScreen(ct.y);const a=Math.min(1,ct.life/30);ctx.fillStyle=rgba(parseInt(ct.color.match(/\d+/g)[0]),parseInt(ct.color.match(/\d+/g)[1]),parseInt(ct.color.match(/\d+/g)[2]),a);ctx.font="bold 20px Arial";ctx.textAlign="center";ctx.fillText(ct.text,ct.x,sy);}
    ctx.restore();
    drawHUD(ctx);

    if(gameOver){
        ctx.fillStyle=rgba(0,0,0,0.7);
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        ctx.fillStyle=YELLOW;
        ctx.font=`bold ${Math.min(48,WIDTH*0.05)}px Arial`;
        ctx.textAlign="center";
        ctx.fillText(winner?`${winner.name} WINS!`:"DRAW!",WIDTH/2,HEIGHT/2-40);
        ctx.fillStyle=WHITE;
        ctx.font="24px Arial";
        ctx.fillText("Press R: Change Character  |  Press R twice: Change Mode  |  ESC: Quit",WIDTH/2,HEIGHT/2+20);
    }
    else{
        ctx.fillStyle=rgba(40,40,40,0.8);
        ctx.font="14px Arial";
        ctx.textAlign="center";
        ctx.fillText(`P1 (${customChar.name}): A/D W F G SPACE(ray) Q(aerial) | ☄️ Dodge ASTEROIDS!`,WIDTH/2,HEIGHT-15);
    }
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
resetFighters();
requestAnimationFrame(gameLoop);
</script>
