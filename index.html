const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();
let audioInitialized = false;

function initAudio() {
    if (!audioInitialized) { audioCtx.resume(); audioInitialized = true; document.getElementById('startOverlay').style.display = 'none'; }
}
window.addEventListener('click', initAudio);
window.addEventListener('keydown', initAudio);

function playTone(freq, duration, type = 'sine', volume = 0.1) {
    if (!audioInitialized) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playNoise(duration, volume = 0.1) {
    if (!audioInitialized) return;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    noise.connect(gain); gain.connect(audioCtx.destination); noise.start();
}
function playBeamSound(duration) {
    if (!audioInitialized) return;
    const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc1.type = 'sawtooth'; osc2.type = 'square';
    osc1.frequency.setValueAtTime(220, audioCtx.currentTime); osc1.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + duration);
    osc2.frequency.setValueAtTime(440, audioCtx.currentTime); osc2.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(); osc2.start(); osc1.stop(audioCtx.currentTime + duration); osc2.stop(audioCtx.currentTime + duration);
}

const sounds = {

function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}
function worldToScreen(worldY) { return worldY - cameraY; }
function triggerScreenShake(intensity, duration) { screenShakeIntensity = intensity; screenShakeDuration = duration; }
function updateScreenShake() {
    if (screenShakeDuration > 0) {
        screenShakeX = (Math.random() * 2 - 1) * screenShakeIntensity;
        screenShakeY = (Math.random() * 2 - 1) * screenShakeIntensity;
        screenShakeDuration--;
    } else { screenShakeX = 0; screenShakeY = 0; }
}

// --- ASTEROID CLASSES ---
class Asteroid {
    constructor(x, sizeType) {
        this.x = x;
        this.y = cameraY - 60;
        this.sizeType = sizeType;
        const info = ASTEROID_SIZES[sizeType];
        this.radius = info.radius + Math.random() * 6 - 3;
        this.damage = info.damage;
        this.speed = info.speed + Math.random() * 2;
        this.impactRadius = info.impactRadius;
        this.color = info.color;
        this.shake = info.shake;
        this.shakeDur = info.shakeDur;
        this.destroysPlatforms = info.destroysPlatforms || false;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.15;
        this.vel_x = (Math.random() - 0.5) * 2;
        this.dead = false;
        this.trail = [];
        this.life = 0;
        this.craters = []; // Surface detail
        for (let i = 0; i < 4; i++) {
            this.craters.push({
                angle: Math.random() * Math.PI * 2,
                dist: Math.random() * this.radius * 0.6,
                size: Math.random() * this.radius * 0.3 + 2
            });
        }
        sounds.asteroid_whoosh();
    }

    update() {
        this.life++;
        this.y += this.speed;
        this.speed += 0.12; // Accelerate as it falls
        this.x += this.vel_x;
        this.rotation += this.rotSpeed;

        // Trail particles
        for (let i = 0; i < 3; i++) {
            this.trail.push({
                x: this.x + (Math.random() - 0.5) * this.radius,
                y: this.y - this.radius * 0.5 + Math.random() * this.radius * 0.5,
                life: 20, maxLife: 20,
                size: Math.random() * this.radius * 0.5 + 2
            });
        }
        this.trail = this.trail.filter(t => { t.life--; t.y -= 1; return t.life > 0; });

        // Check collision with fighters
        for (const f of fighters) {
            if (f.health <= 0) continue;
            const dist = Math.hypot(f.x - this.x, (f.y - f.height * 0.5) - this.y);
            if (dist < this.radius + 25) {
                f.takeHit(this.damage, this.x < f.x);
                f.vel_y = -14;
                f.x += (f.x > this.x ? 1 : -1) * 30;
                f.x = Math.max(f.width, Math.min(WIDTH - f.width, f.x));
                comboTexts.push({ x: f.x, y: f.y - f.height - 10, text: `-${this.damage}`, life: 50, color: COMBO_ORANGE });
                this.explode();
                return;
            }
        }

        // Check collision with platforms
        for (const plat of platforms) {
            if (this.x >= plat.x - this.radius && this.x <= plat.x + plat.w + this.radius &&
                this.y + this.radius >= plat.y && this.y - this.radius <= plat.y + plat.h) {
                this.explode();
                return;
            }
        }

        // Hit lava / ground
        if (this.y >= currentLavaY) {
            this.explode();
            return;
        }

        // Off screen bottom
        if (this.y > cameraY + HEIGHT + 100) {
            this.dead = true;
        }
    }

    explode() {
        this.dead = true;
        sounds.asteroid_impact(this.sizeType);
        triggerScreenShake(this.shake, this.shakeDur);
        asteroidImpacts.push(new AsteroidImpact(this.x, this.y, this.sizeType));

        // Destroy platforms if large
        if (this.destroysPlatforms) {
            const toDestroy = [];
            for (const plat of platforms) {
                const cx = Math.max(plat.x, Math.min(this.x, plat.x + plat.w));
                const cy = Math.max(plat.y, Math.min(this.y, plat.y + plat.h));
                if (Math.hypot(cx - this.x, cy - this.y) < this.impactRadius * 0.7) {
                    toDestroy.push(plat);
                }
            }
            if (platforms.length - toDestroy.length >= 2) {
                for (const plat of toDestroy) {
                    for (let i = 0; i < 15; i++) {
                        debris.push(new Debris(plat.x + Math.random() * plat.w, plat.y + Math.random() * plat.h, rgb(110, 90, 70)));
                    }
                    const idx = platforms.indexOf(plat);
                    if (idx > -1) platforms.splice(idx, 1);
                }
                sounds.crumble();
            }
        }

        // Debris from the asteroid itself
        const numDebris = this.sizeType === 'large' ? 20 : (this.sizeType === 'medium' ? 12 : 6);
        for (let i = 0; i < numDebris; i++) {
            debris.push(new Debris(
                this.x + (Math.random() - 0.5) * this.radius * 2,
                this.y + (Math.random() - 0.5) * this.radius,
                rgb(100 + Math.random() * 60, 70 + Math.random() * 40, 40 + Math.random() * 30)
            ));
        }
    }

    draw(ctx) {
        const screenY = worldToScreen(this.y);
        if (screenY < -100 || screenY > HEIGHT + 100) return;

        // Trail
        for (const t of this.trail) {
            const tsy = worldToScreen(t.y);
            const alpha = (t.life / t.maxLife) * 0.7;
            const r = t.size * (t.life / t.maxLife);
            ctx.fillStyle = rgba(255, 140 + Math.random() * 40, 30, alpha);
            ctx.beginPath(); ctx.arc(t.x, tsy, r, 0, Math.PI * 2); ctx.fill();
        }

        // Glow
        const glowR = this.radius * 2.5;
        const glow = ctx.createRadialGradient(this.x, screenY, this.radius * 0.5, this.x, screenY, glowR);
        glow.addColorStop(0, rgba(255, 120, 30, 0.4));
        glow.addColorStop(0.5, rgba(255, 80, 20, 0.15));
        glow.addColorStop(1, rgba(255, 50, 10, 0));
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(this.x, screenY, glowR, 0, Math.PI * 2); ctx.fill();

        // Asteroid body
        ctx.save();
        ctx.translate(this.x, screenY);
        ctx.rotate(this.rotation);

        // Main rock
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // Irregular shape
        const pts = 8;
        for (let i = 0; i < pts; i++) {
            const angle = (i / pts) * Math.PI * 2;
            const wobble = 0.8 + Math.sin(i * 3.7) * 0.2;
            const r = this.radius * wobble;
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = rgb(80, 60, 40);
        ctx.lineWidth = 2;
        ctx.stroke();

        // Craters
        for (const c of this.craters) {
            const cx = Math.cos(c.angle) * c.dist;
            const cy = Math.sin(c.angle) * c.dist;
            ctx.fillStyle = rgba(60, 40, 25, 0.6);
            ctx.beginPath(); ctx.arc(cx, cy, c.size, 0, Math.PI * 2); ctx.fill();
        }

        // Hot edge (facing direction of travel = bottom)
        ctx.fillStyle = rgba(255, 160, 50, 0.5);
        ctx.beginPath();
        ctx.arc(0, this.radius * 0.3, this.radius * 0.7, 0, Math.PI);
        ctx.fill();

        ctx.restore();
    }
}

class AsteroidImpact {
    constructor(x, y, sizeType) {
        this.x = x;
        this.y = y;
        this.sizeType = sizeType;
        const info = ASTEROID_SIZES[sizeType];
        this.maxRadius = info.impactRadius;
        this.radius = 5;
        this.life = sizeType === 'large' ? 40 : (sizeType === 'medium' ? 28 : 18);
        this.maxLife = this.life;
    }

    update() {
        this.life--;
        if (this.life > this.maxLife * 0.5) {
            this.radius += (this.maxRadius - this.radius) * 0.3;
        } else {
            this.radius += (this.maxRadius - this.radius) * 0.08;
        }
    }

    draw(ctx) {
        if (this.life <= 0) return;
        const screenY = worldToScreen(this.y);
        if (screenY < -this.maxRadius || screenY > HEIGHT + this.maxRadius) return;
        const alpha = this.life / this.maxLife;

        // Outer ring
        ctx.fillStyle = rgba(200, 80, 20, alpha * 0.6);
        ctx.beginPath(); ctx.arc(this.x, screenY, this.radius, 0, Math.PI * 2); ctx.fill();
        // Inner fire
        ctx.fillStyle = rgba(255, 180, 50, alpha * 0.8);
        ctx.beginPath(); ctx.arc(this.x, screenY, this.radius * 0.6, 0, Math.PI * 2); ctx.fill();
        // Hot core
        ctx.fillStyle = rgba(255, 255, 200, alpha * 0.9);
        ctx.beginPath(); ctx.arc(this.x, screenY, this.radius * 0.25, 0, Math.PI * 2); ctx.fill();
    }
}

class AsteroidWarning {
    constructor(x, sizeType) {
        this.x = x;
        this.sizeType = sizeType;
        this.life = ASTEROID_WARNING_TIME;
        this.maxLife = ASTEROID_WARNING_TIME;
        this.radius = ASTEROID_SIZES[sizeType].impactRadius;
    }

    update() {
        this.life--;
        if (this.life <= 0) return false;
        return true;
    }

    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = 0.3 + 0.4 * Math.sin((this.maxLife - this.life) * 0.3);
        const pulse = 1.0 + 0.1 * Math.sin((this.maxLife - this.life) * 0.4);
        const r = this.radius * pulse;

        // Warning circle on the ground
        const groundY = worldToScreen(currentLavaY - 5);
        ctx.strokeStyle = rgba(255, 60, 30, alpha);
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.arc(this.x, groundY, r, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);

        // Fill
        ctx.fillStyle = rgba(255, 40, 20, alpha * 0.2);
        ctx.beginPath(); ctx.arc(this.x, groundY, r, 0, Math.PI * 2); ctx.fill();

        // Crosshair
        ctx.strokeStyle = rgba(255, 100, 50, alpha * 0.8);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - r * 0.5, groundY); ctx.lineTo(this.x + r * 0.5, groundY);
        ctx.moveTo(this.x, groundY - r * 0.5); ctx.lineTo(this.x, groundY + r * 0.5);
        ctx.stroke();

        // "!" warning text
        if (this.life < this.maxLife * 0.5) {
            ctx.fillStyle = rgba(255, 60, 30, alpha);
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.fillText("!", this.x, groundY - r - 10);
        }
    }
}

function spawnAsteroidWave() {
    // Determine how many to spawn
    let count = 1;
    if (Math.random() < ASTEROID_BURST_CHANCE) {
        count = Math.floor(Math.random() * 3) + 2; // 2-4
    }

    for (let i = 0; i < count; i++) {
        const x = Math.random() * (WIDTH - 100) + 50;
        // Weight toward smaller asteroids
        const roll = Math.random();
        let sizeType;
        if (roll < 0.55) sizeType = 'small';
        else if (roll < 0.85) sizeType = 'medium';
        else sizeType = 'large';

        // Create warning first, then asteroid after delay
        const warning = new AsteroidWarning(x, sizeType);
        asteroidWarnings.push(warning);

        // Delay the actual asteroid spawn to match warning time
        setTimeout(() => {
            if (state === "playing" && !gameOver) {
                asteroids.push(new Asteroid(x, sizeType));
            }
        }, (ASTEROID_WARNING_TIME / 60) * 1000);
    }
}

function updateAIFor(cpu, cpuIdx) {
    const aiKeys = aiKeysPool[cpuIdx];
    for (let k in aiKeys) aiKeys[k] = false;
    if (!cpu || cpu.health <= 0) return;

    let target = null, minDist = Infinity;
    for (const other of fighters) {
        if (other === cpu || other.health <= 0) continue;
        const d = Math.hypot(other.x - cpu.x, other.y - cpu.y);
        if (d < minDist) { minDist = d; target = other; }
    }
    if (!target) return;

    let dx = target.x - cpu.x, dy = target.y - cpu.y, dist = Math.abs(dx);

    let inDanger = false;
    if (cpu.y > currentLavaY - 150) {
        aiKeys['ArrowUp'] = true; inDanger = true;
        let safePlats = platforms.filter(p => p.y < currentLavaY - 100);
        if (safePlats.length > 0) {
            let best = safePlats.reduce((prev, curr) => prev.y < curr.y ? prev : curr);
            if (best.x + best.w/2 > cpu.x) aiKeys['ArrowRight'] = true; else aiKeys['ArrowLeft'] = true;
        }
    }

    // --- ASTEROID AVOIDANCE ---
    for (const warn of asteroidWarnings) {
        const wdx = cpu.x - warn.x;
        if (Math.abs(wdx) < warn.radius + 30) {
            if (wdx > 0) aiKeys['ArrowRight'] = true; else aiKeys['ArrowLeft'] = true;
            if (cpu.on_ground && Math.random() < 0.2) aiKeys['ArrowUp'] = true;
            inDanger = true;
        }
    }
    for (const ast of asteroids) {
        const adx = cpu.x - ast.x;
        const ady = cpu.y - ast.y;
        if (Math.abs(adx) < ast.radius + 40 && ady > -100 && ady < 200) {
            if (adx > 0) aiKeys['ArrowRight'] = true; else aiKeys['ArrowLeft'] = true;
            if (cpu.on_ground) aiKeys['ArrowUp'] = true;
            inDanger = true;
        }
    }

    for (const rad of radiationClouds) {
        if (Math.hypot(cpu.x - rad.x, (cpu.y - cpu.height/2) - rad.y) < rad.radius + 40) {
            if (cpu.x > rad.x) aiKeys['ArrowRight'] = true; else aiKeys['ArrowLeft'] = true;
            inDanger = true; break;
        }
    }
    for (const exp of [...explosions, ...nukeExplosions]) {
        if (Math.hypot(cpu.x - exp.x, (cpu.y - cpu.height/2) - exp.y) < exp.max_radius + 60) {
            if (cpu.x > exp.x) aiKeys['ArrowRight'] = true; else aiKeys['ArrowLeft'] = true;
            inDanger = true; break;
        }
    }
    for (const ray of superRays) {
        if (ray.owner === cpu) continue;
        if (Math.abs(cpu.y - cpu.height * 0.5 - ray.y) < SUPER_RAY_WIDTH + 30) {
            if (ray.facing === 1 && cpu.x > ray.x) { inDanger = true; aiKeys['ArrowUp'] = true; break; }
            if (ray.facing === -1 && cpu.x < ray.x) { inDanger = true; aiKeys['ArrowUp'] = true; break; }
        }
    }
    if (inDanger) return;

    let currentPlat = null;
    for (const plat of platforms) {
        if (cpu.x >= plat.x && cpu.x <= plat.x + plat.w && Math.abs(cpu.y - plat.y) < 5) { currentPlat = plat; break; }
    }
    let isLeftEdge = currentPlat ? (cpu.x - currentPlat.x < 30) : false;
    let isRightEdge = currentPlat ? (currentPlat.x + currentPlat.w - cpu.x < 30) : false;

    let targetX, targetY, isPickupMode = false;
    if (!cpu.weapon && weapons.length > 0) {
        let valid = weapons.filter(w => w.y < currentLavaY - 50);
        if (valid.length > 0) {
            let closest = valid.reduce((p, c) => Math.hypot(cpu.x - p.x, cpu.y - p.y) < Math.hypot(cpu.x - c.x, cpu.y - c.y) ? p : c);
            targetX = closest.x; targetY = closest.y; isPickupMode = true;
        }
    }
    if (!isPickupMode && !cpu.armor && armors.length > 0) {
        let valid = armors.filter(a => a.y < currentLavaY - 50);
        if (valid.length > 0) {
            let closest = valid.reduce((p, c) => Math.hypot(cpu.x - p.x, cpu.y - p.y) < Math.hypot(cpu.x - c.x, cpu.y - c.y) ? p : c);
            targetX = closest.x; targetY = closest.y; isPickupMode = true;
        }
    }
    if (!isPickupMode) {
        let targetPlat = null, bestScore = -Infinity;
        let optimalDist = cpu.isRanged() ? 350 : 80;
        for (const plat of platforms) {
            if (plat.y > currentLavaY - 50) continue;
            let pcx = plat.x + plat.w / 2;
            let score = -Math.abs(pcx - target.x) * 0.5;
            let dty = plat.y - target.y;
            if (dty >= -50 && dty <= 100) score += 150; else if (dty > 100) score -= dty;
            score += -Math.abs(Math.abs(pcx - target.x) - optimalDist) * 2 + Math.random() * 30;
            if (score > bestScore) { bestScore = score; targetPlat = plat; }
        }
        if (targetPlat) { targetX = targetPlat.x + targetPlat.w / 2; targetY = targetPlat.y; }
        else { targetX = target.x; targetY = target.y; }
    }

    let dirX = targetX > cpu.x ? 1 : -1;
    let allowDrop = targetY > cpu.y + 80;
    if (targetY < cpu.y - 20) {
        if (cpu.on_ground) aiKeys['ArrowUp'] = true;
        if (dirX > 0 && (!isRightEdge || allowDrop)) aiKeys['ArrowRight'] = true;
        else if (dirX < 0 && (!isLeftEdge || allowDrop)) aiKeys['ArrowLeft'] = true;
    } else {
        if (dirX > 0 && (!isRightEdge || allowDrop)) aiKeys['ArrowRight'] = true;
        else if (dirX < 0 && (!isLeftEdge || allowDrop)) aiKeys['ArrowLeft'] = true;
    }

    if (!isPickupMode) {
        if (cpu.isSuperReady()) {
            const facing = (dx > 0 && cpu.facing === 1) || (dx < 0 && cpu.facing === -1);
            if (facing && Math.abs(dy) < 80 && dist < 600 && dist > 50) aiKeys['Enter'] = true;
        } else if (!cpu.on_ground && cpu.aerial_combo_cd === 0 && cpu.aerial_combo_timer === 0 && dist < AERIAL_COMBO_RANGE + 30 && Math.abs(dy) < 80 && Math.random() < 0.15) {
            aiKeys['KeyQ'] = true;
        } else if (cpu.punch_cd === 0) {
            if (cpu.weapon) {
                if (cpu.isRanged()) {
                    if (((dx > 0 && cpu.facing === 1) || (dx < 0 && cpu.facing === -1)) && dist > 100 && dist < 600 && Math.abs(dy) < 150) aiKeys['KeyK'] = true;
                } else if (cpu.weapon.type === 'bomb' || cpu.weapon.type === 'nuke') {
                    if (dist > 120 && dist < 350 && Math.abs(dy) < 100) aiKeys['KeyK'] = true;
                } else {
                    if (dist < cpu.currentStats().reach + 20 && Math.abs(dy) < 40) aiKeys['KeyK'] = true;
                }
            } else {
                if (dist < PUNCH_RANGE + 20 && Math.abs(dy) < 30) { if (Math.random() < 0.5) aiKeys['KeyK'] = true; else aiKeys['KeyL'] = true; }
                else if (dist < KICK_RANGE + 20 && Math.abs(dy) < 40) aiKeys['KeyL'] = true;
            }
        }
    }
}

function generateNewPlatforms() {
    for (let i = platforms.length - 1; i >= 0; i--) { if (platforms[i].y >= currentLavaY) platforms.splice(i, 1); }
    let needed = TARGET_PLATFORM_COUNT - platforms.length;
    if (needed <= 0 || platforms.length >= MAX_PLATFORMS) return;
    let highestTop = platforms.length > 0 ? Math.min(...platforms.map(p => p.y)) : currentLavaY - 100;
    let szb = highestTop - 40, szt = Math.max(MIN_PLATFORM_Y, szb - 180);
    if (szb <= szt + 20) { szt = Math.max(MIN_PLATFORM_Y, currentLavaY - 350); szb = currentLavaY - 50; }
    let np = [], att = 0;
    while (np.length < needed && att < 150) {
        att++;
        const w = Math.floor(Math.random() * 71) + 80, h = [16, 18, 20][Math.floor(Math.random() * 3)];
        const x = Math.floor(Math.random() * (WIDTH - 120 - w)) + 60;
        const y = Math.floor(Math.random() * (Math.max(szt, szb) - szt + 1)) + szt;
        const newPlat = { x, y, w, h }; let overlap = false;
        for (const e of [...platforms, ...np]) { if (rectIntersect({x: newPlat.x-15, y: newPlat.y-25, w: newPlat.w+30, h: newPlat.h+50}, e)) { overlap = true; break; } }
        if (!overlap) { np.push(newPlat); platformSpawnAnims.push({ plat: newPlat, frames: 25 }); }
    }
    platforms.push(...np);
    if (np.length > 0) sounds.platform_spawn();
}

function updateCamera() {
    const alive = fighters.filter(f => f.health > 0);
    if (alive.length === 0) return;
    targetCameraY = Math.max(0, Math.min(...alive.map(f => f.y)) - CAMERA_TARGET_OFFSET);
    cameraY += (targetCameraY - cameraY) * CAMERA_SMOOTHING;
}

class SuperRay {
    constructor(owner) {
        this.owner = owner; this.x = owner.x; this.y = owner.y - owner.height * 0.55;
        this.facing = owner.facing; this.life = SUPER_RAY_DURATION; this.maxLife = SUPER_RAY_DURATION;
        this.width = SUPER_RAY_WIDTH; this.hasHitTargets = new Set(); this.pulse = 0; this.sparks = [];
        triggerScreenShake(15, SUPER_RAY_DURATION); sounds.super_beam();
    }
    update() {
        this.life--; this.pulse += 0.4; this.x = this.owner.x; this.y = this.owner.y - this.owner.height * 0.55;
        if (Math.random() < 0.6) {
            const d = Math.random() * WIDTH;
            const sx = this.facing === 1 ? this.x + d : this.x - d;
            if (sx >= 0 && sx <= WIDTH) this.sparks.push({ x: sx, y: this.y + (Math.random()*2-1)*this.width*0.4, life: 15, maxLife: 15, size: Math.random()*4+2, vy: (Math.random()*2-1)*2 });
        }
        for (let i = this.sparks.length - 1; i >= 0; i--) { this.sparks[i].life--; this.sparks[i].y += this.sparks[i].vy; if (this.sparks[i].life <= 0) this.sparks.splice(i, 1); }
        const br = this.getBeamRect();
        for (const t of fighters) {
            if (t === this.owner || t.health <= 0 || this.hasHitTargets.has(t)) continue;
            if (rectIntersect(br, t.getRect())) {
                t.takeHit(SUPER_RAY_DAMAGE, this.x < t.x); t.vel_y = SUPER_RAY_POP;
                t.x = Math.max(t.width, Math.min(WIDTH - t.width, t.x + this.facing * SUPER_RAY_KNOCKBACK));
                this.hasHitTargets.add(t);
                comboTexts.push({ x: t.x, y: t.y - t.height - 20, text: `-${SUPER_RAY_DAMAGE}`, life: 60, color: PURPLE });
                triggerScreenShake(20, 10);
            }
        }
    }
    getBeamRect() {
        if (this.facing === 1) return { x: this.x, y: this.y - this.width/2, w: WIDTH, h: this.width };
        else return { x: this.x - WIDTH, y: this.y - this.width/2, w: WIDTH, h: this.width };
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const sy = worldToScreen(this.y), lr = this.life / this.maxLife;
        const pf = 1.0 + 0.15 * Math.sin(this.pulse), cw = this.width * pf * (lr > 0.3 ? 1 : lr / 0.3), hw = cw / 2;
        let sx = this.x, ex = this.facing === 1 ? WIDTH : 0;
        const bg = ctx.createLinearGradient(sx, sy - hw*2, sx, sy + hw*2);
        bg.addColorStop(0, rgba(180,80,255,0)); bg.addColorStop(0.5, rgba(180,80,255,0.4*lr)); bg.addColorStop(1, rgba(180,80,255,0));
        ctx.fillStyle = bg; ctx.fillRect(Math.min(sx,ex), sy-hw*2, Math.abs(ex-sx), hw*4);
        const mg = ctx.createLinearGradient(sx, sy-hw, sx, sy+hw);
        mg.addColorStop(0, rgba(140,40,200,0.3*lr)); mg.addColorStop(0.5, rgba(255,200,255,lr)); mg.addColorStop(1, rgba(140,40,200,0.3*lr));
        ctx.fillStyle = mg; ctx.fillRect(Math.min(sx,ex), sy-hw, Math.abs(ex-sx), cw);
        const cg = ctx.createLinearGradient(sx, sy-cw*0.175, sx, sy+cw*0.175);
        cg.addColorStop(0, rgba(255,255,255,0)); cg.addColorStop(0.5, rgba(255,255,255,lr)); cg.addColorStop(1, rgba(255,255,255,0));
        ctx.fillStyle = cg; ctx.fillRect(Math.min(sx,ex), sy-cw*0.175, Math.abs(ex-sx), cw*0.35);
        const burst = ctx.createRadialGradient(this.x, sy, 0, this.x, sy, cw*1.5);
        burst.addColorStop(0, rgba(255,255,255,lr)); burst.addColorStop(0.5, rgba(200,100,255,0.4*lr)); burst.addColorStop(1, rgba(180,80,255,0));
        ctx.fillStyle = burst; ctx.beginPath(); ctx.arc(this.x, sy, cw*1.5, 0, Math.PI*2); ctx.fill();
        for (const s of this.sparks) {
            const ssy = worldToScreen(s.y), a = (s.life/s.maxLife)*lr;
            ctx.fillStyle = rgba(255,220,255,a); ctx.beginPath(); ctx.arc(s.x, ssy, s.size, 0, Math.PI*2); ctx.fill();
        }
    }
}

class Fighter {
    constructor(x, color, darkColor, facing, controls, name, isAI = false, playerIdx = 0) {
        this.x = x; this.y = GROUND_Y; this.vel_y = 0; this.width = 40; this.height = 110;
        this.color = color; this.darkColor = darkColor; this.facing = facing;
        this.controls = controls; this.name = name; this.health = MAX_HEALTH;
        this.on_ground = true; this.punch_cd = 0; this.kick_cd = 0;
        this.attack_anim = 0; this.attack_type = null; this.hit_stun = 0;
        this.walk_cycle = 0; this.moving = false;
        this.weapon = null; this.armor = null; this.armor_flash = 0;
        this.reload_timer = 0; this.super_charge = 0; this.super_cooldown = 0;
        this.super_flash = 0; this.radiation_flash = 0;
        this.isAI = isAI; this.playerIdx = playerIdx;
        this.aerial_combo_cd = 0; this.aerial_combo_timer = 0;
        this.aerial_combo_hits_landed = 0; this.aerial_combo_hit_flags = [false, false, false];
        this.combo_trail = []; this.firing_ray = false;
    }
    getRect() { return { x: this.x - this.width/2, y: this.y - this.height, w: this.width, h: this.height }; }
    getAerialComboHitbox() {
        if (this.aerial_combo_timer === 0) return null;
        const fe = AERIAL_COMBO_DURATION - this.aerial_combo_timer;
        const hf = [AERIAL_COMBO_HIT1_FRAME, AERIAL_COMBO_HIT2_FRAME, AERIAL_COMBO_HIT3_FRAME];
        let ah = -1;
        for (let i = 0; i < hf.length; i++) { if (fe >= hf[i] && fe < hf[i]+3) { ah = i; break; } }
        if (ah === -1) return null;
        return { x: this.x - AERIAL_COMBO_RANGE, y: this.y - this.height*0.6 - AERIAL_COMBO_RANGE, w: AERIAL_COMBO_RANGE*2, h: AERIAL_COMBO_RANGE*2, hitIndex: ah };
    }
    currentStats() { if (this.weapon) { const i = WEAPON_TYPES[this.weapon.type]; return { reach: i.reach, damage: i.damage, cooldown: i.cooldown }; } return { reach: PUNCH_RANGE, damage: PUNCH_DAMAGE, cooldown: PUNCH_COOLDOWN }; }
    attackHitbox() {
        if (this.attack_type === "weapon" && this.weapon) { const r = this.currentStats().reach; return { x: this.facing===1?this.x:this.x-r, y: this.y-this.height*0.6-12, w: r, h: 24 }; }
        if (this.attack_type === "punch") return { x: this.facing===1?this.x:this.x-PUNCH_RANGE, y: this.y-this.height*0.65-10, w: PUNCH_RANGE, h: 20 };
        if (this.attack_type === "kick") return { x: this.facing===1?this.x:this.x-KICK_RANGE, y: this.y-this.height*0.35-13, w: KICK_RANGE, h: 26 };
        return null;
    }
    tryPickupWeapon(w) { if (this.weapon) return; for (let i=w.length-1;i>=0;i--) { if (rectIntersect(this.getRect(),w[i].getRect())) { const info=WEAPON_TYPES[w[i].type]; this.weapon={type:w[i].type,durability:info.durability,current_mag:info.mag_size||0}; w.splice(i,1); return; } } }
    tryPickupArmor(a) { for (let i=a.length-1;i>=0;i--) { if (rectIntersect(this.getRect(),a[i].getRect())) { const info=ARMOR_TYPES[a[i].type]; this.armor={type:a[i].type,durability:info.durability}; this.armor_flash=12; a.splice(i,1); sounds.armor_pickup(); return; } } }
    isRanged() { return this.weapon && WEAPON_TYPES[this.weapon.type].ranged; }
    isReloading() { return this.reload_timer > 0; }
    isSuperReady() { return this.super_charge >= MAX_SUPER_CHARGE && this.super_cooldown === 0; }
    startReload() { if (this.weapon && WEAPON_TYPES[this.weapon.type].mag_size > 0) { this.reload_timer = RELOAD_TIME; sounds.reload(); } }
    shoot(a) { const i=WEAPON_TYPES[this.weapon.type]; const sx=this.x+this.facing*26; const sy=this.y-this.height*0.6+(this.weapon.type==="gatling"?(Math.random()*12-6):(this.weapon.type==="uzi"?(Math.random()*6-3):0)); a.push(new Arrow(sx,sy,this.facing,i.damage,this,i.proj_speed,i.proj_kind)); this.weapon.current_mag--; if(this.weapon.current_mag<=0) this.startReload(); }
    throwBomb(b) { const i=WEAPON_TYPES[this.weapon.type]; const sx=this.x+this.facing*20,sy=this.y-this.height*0.7; if(i.proj_kind==="nuke") b.push(new Nuke(sx,sy,this.facing,i.damage,this)); else b.push(new Bomb(sx,sy,this.facing,i.damage,this)); this.weapon.durability--; if(this.weapon.durability<=0){this.weapon=null;sounds.break();} }
    fireSuperRay() { if(!this.isSuperReady()) return false; superRays.push(new SuperRay(this)); this.super_charge=0; this.super_cooldown=SUPER_RAY_COOLDOWN; this.super_flash=25; this.firing_ray=true; this.attack_type="super_ray"; this.attack_anim=SUPER_RAY_DURATION; sounds.super_fire(); return true; }
    startAerialCombo() { if(this.on_ground||this.aerial_combo_cd>0||this.aerial_combo_timer>0||this.hit_stun>0) return false; this.aerial_combo_timer=AERIAL_COMBO_DURATION; this.aerial_combo_hits_landed=0; this.aerial_combo_hit_flags=[false,false,false]; this.aerial_combo_cd=AERIAL_COMBO_COOLDOWN; this.attack_type="aerial_combo"; this.attack_anim=AERIAL_COMBO_DURATION; this.combo_trail=[]; sounds.combo_start(); return true; }
    handleInput(wList, aList, aRows, bList, keySource) {
        if (this.hit_stun > 0 || this.health <= 0) { if(this.hit_stun>0) this.hit_stun--; this.moving=false; return; }
        const c = this.controls; this.moving = false;
        if (this.aerial_combo_timer > 0) { if(keySource[c.left]){this.x-=MOVE_SPEED*0.4;this.facing=-1;} if(keySource[c.right]){this.x+=MOVE_SPEED*0.4;this.facing=1;} this.x=Math.max(this.width,Math.min(WIDTH-this.width,this.x)); this.tryPickupWeapon(wList); this.tryPickupArmor(aList); return; }
        if (this.firing_ray) { if(keySource[c.left]) this.facing=-1; if(keySource[c.right]) this.facing=1; this.tryPickupWeapon(wList); this.tryPickupArmor(aList); return; }
        if (keySource[c.left]) { this.x -= MOVE_SPEED; this.facing = -1; this.moving = true; }
        if (keySource[c.right]) { this.x += MOVE_SPEED; this.facing = 1; this.moving = true; }
        this.x = Math.max(this.width, Math.min(WIDTH - this.width, this.x));
        if (keySource[c.jump] && this.on_ground) { this.vel_y = JUMP_STRENGTH; this.on_ground = false; }
        if (keySource[c.aerial] && !this.on_ground) { if(this.startAerialCombo()){this.tryPickupWeapon(wList);this.tryPickupArmor(aList);return;} }
        if (keySource[c.super] && this.isSuperReady()) { if(this.fireSuperRay()){this.tryPickupWeapon(wList);this.tryPickupArmor(aList);return;} }

class WeaponPickup { constructor(x,y,t){this.x=x;this.y=y;this.type=t;} getRect(){return{x:this.x-20,y:this.y-40,w:40,h:40};} draw(c){const sy=worldToScreen(this.y);if(sy<-80||sy>HEIGHT+80)return;const i=WEAPON_TYPES[this.type];c.fillStyle=rgba(240,200,40,0.2);c.beginPath();c.arc(this.x,sy-20,30,0,Math.PI*2);c.fill();c.fillStyle=i.color;c.fillRect(this.x-10,sy-35,20,30);c.fillStyle=BLACK;c.font="12px Arial";c.textAlign="center";c.fillText(this.type.charAt(0).toUpperCase()+this.type.slice(1),this.x,sy-45);} }
class ArmorPickup { constructor(x,y,t){this.x=x;this.y=y;this.type=t;} getRect(){return{x:this.x-20,y:this.y-40,w:40,h:40};} draw(c){const sy=worldToScreen(this.y);if(sy<-80||sy>HEIGHT+80)return;const i=ARMOR_TYPES[this.type];c.fillStyle=i.color;c.beginPath();c.arc(this.x,sy-20,20,0,Math.PI*2);c.fill();c.fillStyle=BLACK;c.font="12px Arial";c.textAlign="center";c.fillText(i.name,this.x,sy-45);} }

function checkHits() { for(const a of fighters){if(a.health<=0||!["punch","kick","weapon"].includes(a.attack_type))continue;const iw=a.attack_type==="weapon";const tf=iw?11:(a.attack_type==="punch"?9:12);if(a.attack_anim===tf){const b=a.attackHitbox();if(!b)continue;for(const d of fighters){if(d===a||d.health<=0||d.hit_stun>0)continue;if(rectIntersect(b,d.getRect())){d.takeHit(a.currentStats().damage,a.x<d.x);if(a.attack_type==="punch")a.addSuperCharge(SUPER_CHARGE_PER_PUNCH);else if(a.attack_type==="kick")a.addSuperCharge(SUPER_CHARGE_PER_KICK);else if(iw){a.registerWeaponHit();a.addSuperCharge(SUPER_CHARGE_PER_PROJECTILE);}}}}} }
function checkAerialComboHits() { for(const a of fighters){if(a.health<=0||a.aerial_combo_timer===0)continue;const h=a.getAerialComboHitbox();if(!h)continue;const hi=h.hitIndex;if(a.aerial_combo_hit_flags[hi])continue;for(const d of fighters){if(d===a||d.health<=0)continue;if(rectIntersect(h,d.getRect())){const dmg=AERIAL_COMBO_DAMAGE[hi];d.health=Math.max(0,d.health-dmg);d.x+=a.x<d.x?AERIAL_COMBO_KNOCKBACK[hi]:-AERIAL_COMBO_KNOCKBACK[hi];d.x=Math.max(d.width,Math.min(WIDTH-d.width,d.x));d.vel_y=AERIAL_COMBO_POP[hi];d.on_ground=false;d.hit_stun=AERIAL_COMBO_HITSTUN;a.aerial_combo_hit_flags[hi]=true;a.aerial_combo_hits_landed++;a.addSuperCharge(SUPER_CHARGE_PER_COMBO_HIT);if(hi===2){triggerScreenShake(12,15);sounds.combo_finisher();}else{triggerScreenShake(5,6);sounds.combo_hit(hi);}comboTexts.push({x:d.x,y:d.y-d.height-10,text:`-${dmg}`,life:40,color:hi===2?COMBO_ORANGE:YELLOW});break;}}} }
function updateArrows() { for(let i=arrows.length-1;i>=0;i--){arrows[i].update();if(!arrows[i].dead){for(const t of fighters){if(t===arrows[i].owner||t.health<=0||t.hit_stun>0)continue;if(rectIntersect(arrows[i].getRect(),t.getRect())){t.takeHit(arrows[i].damage,arrows[i].facing===1);arrows[i].owner.addSuperCharge(SUPER_CHARGE_PER_PROJECTILE);arrows[i].dead=true;break;}}}if(arrows[i].dead)arrows.splice(i,1);} }
function spawnWeapon() { if(weapons.length>=MAX_WEAPONS_ON_FIELD||platforms.length===0)return;const p=platforms[Math.floor(Math.random()*platforms.length)];const t=Math.random()<0.05?"nuke":WEAPON_CHOICES[Math.floor(Math.random()*(WEAPON_CHOICES.length-1))+1];weapons.push(new WeaponPickup(p.x+25+Math.random()*(p.w-50),p.y,t)); }
function spawnArmor() { if(armors.length>=MAX_ARMOR_ON_FIELD||platforms.length===0)return;const p=platforms[Math.floor(Math.random()*platforms.length)];const ts=["light","light","light","light","light","medium","medium","medium","heavy"];armors.push(new ArmorPickup(p.x+25+Math.random()*(p.w-50),p.y,ts[Math.floor(Math.random()*ts.length)])); }
function spawnFireball() { fireballs.push(new Fireball(Math.random()*(WIDTH-100)+50,cameraY-50));sounds.fireball(); }
function generateInitialPlatforms() { platforms=[];const n=Math.floor(WIDTH/100)+8;let a=0;while(platforms.length<n&&a<800){a++;const w=100+Math.random()*100,h=18,x=Math.random()*(WIDTH-w),y=150+Math.random()*(HEIGHT-300);let o=false;for(const p of platforms){if(x<p.x+p.w+20&&x+w+20>p.x&&y<p.y+p.h+40&&y+h+40>p.y){o=true;break;}}if(!o)platforms.push({x,y,w,h});}platforms.push({x:100,y:HEIGHT-250,w:150,h:18});platforms.push({x:WIDTH-250,y:HEIGHT-250,w:150,h:18});platforms.push({x:WIDTH*0.35,y:HEIGHT-320,w:150,h:18});platforms.push({x:WIDTH*0.65-150,y:HEIGHT-320,w:150,h:18}); }

function resetFighters() {
    generateInitialPlatforms();
    platformSpawnAnims=[];currentLavaY=GROUND_Y;lavaRiseTimer=LAVA_RISE_INTERVAL;lavaRiseWarning=0;
    cameraY=0;targetCameraY=0;comboTexts=[];
    asteroids=[];asteroidImpacts=[];asteroidWarnings=[];asteroidSpawnTimer=60;
    fighters=[];
    fighters.push(new Fighter(WIDTH*0.2,RED,DARK_RED,1,{left:'KeyA',right:'KeyD',jump:'KeyW',punch:'KeyF',kick:'KeyG',super:'Space',aerial:'KeyQ'},"Player 1",false,0));
    let nc=0;if(gameMode==="1v1")nc=1;else if(gameMode==="1v2")nc=2;else if(gameMode==="1v3")nc=3;else if(gameMode==="multi")nc=1;
    const cc=[{color:BLUE,dark:DARK_BLUE,name:"CPU 2"},{color:GREEN,dark:DARK_GREEN,name:"CPU 3"},{color:PURPLE,dark:DARK_PURPLE,name:"CPU 4"}];
    const sp=[WIDTH*0.8,WIDTH*0.35,WIDTH*0.65];
    for(let i=0;i<nc;i++){const cfg=cc[i];const ih=gameMode==="multi"&&i===0;const ct=ih?{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',punch:'KeyK',kick:'KeyL',super:'Enter',aerial:'KeyN'}:{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',punch:'KeyK',kick:'KeyL',super:'Enter',aerial:'KeyQ'};fighters.push(new Fighter(sp[i],cfg.color,cfg.dark,-1,ct,ih?"Player 2":cfg.name,!ih,i+1));}
    for(const f of fighters)f.y=HEIGHT-250;
    for(let i=0;i<fighters.length;i++)fighters[i].wins=wins[i];
    if(WEAPON_CHOICES[p1Idx]){const info=WEAPON_TYPES[WEAPON_CHOICES[p1Idx]];fighters[0].weapon={type:WEAPON_CHOICES[p1Idx],durability:info.durability,current_mag:info.mag_size||0};}
    weapons=[];armors=[];arrows=[];bombs=[];explosions=[];debris=[];superRays=[];fireballs=[];fireExplosions=[];nukeExplosions=[];radiationClouds=[];
    for(let i=0;i<Math.min(3,fighters.length);i++)spawnWeapon();
    for(let i=0;i<Math.min(2,fighters.length);i++)spawnArmor();
}

function handleMenuInput(code) {
    if(state==="mode_select"){if(code==='ArrowUp'||code==='KeyW')modeIdx=(modeIdx-1+MODE_CHOICES.length)%MODE_CHOICES.length;else if(code==='ArrowDown'||code==='KeyS')modeIdx=(modeIdx+1)%MODE_CHOICES.length;else if(code==='KeyF'||code==='KeyK'||code==='Enter'||code==='Space'){gameMode=["1v1","1v2","1v3","multi"][modeIdx];state="select";}}
    else if(state==="select"){if(!p1Ready){if(code==='KeyA')p1Idx=(p1Idx-1+WEAPON_CHOICES.length)%WEAPON_CHOICES.length;else if(code==='KeyD')p1Idx=(p1Idx+1)%WEAPON_CHOICES.length;else if(code==='KeyF')p1Ready=true;}}
    else if(state==="world_select"&&!worldLocked){if(code==='KeyA'||code==='ArrowLeft')stageIdx=(stageIdx-1+STAGES.length)%STAGES.length;else if(code==='KeyD'||code==='ArrowRight')stageIdx=(stageIdx+1)%STAGES.length;else if(code==='KeyF'||code==='KeyK'||code==='Enter'||code==='Space')worldLocked=true;}
    else if(state==="over"&&code==='KeyR'){state="mode_select";p1Idx=0;p1Ready=false;}
}

function drawBackground(c,s){const g=c.createLinearGradient(0,0,0,HEIGHT);g.addColorStop(0,s.sky_top);g.addColorStop(1,s.sky_bottom);c.fillStyle=g;c.fillRect(0,0,WIDTH,HEIGHT);if(s.decor==="volcano"){c.fillStyle=rgb(70,40,35);c.beginPath();c.moveTo(WIDTH*0.7,worldToScreen(GROUND_Y));c.lineTo(WIDTH*0.82,worldToScreen(120));c.lineTo(WIDTH*0.94,worldToScreen(GROUND_Y));c.fill();c.fillStyle=rgb(230,90,30);c.beginPath();c.moveTo(WIDTH*0.79,worldToScreen(200));c.lineTo(WIDTH*0.82,worldToScreen(130));c.lineTo(WIDTH*0.85,worldToScreen(200));c.fill();}const sly=worldToScreen(currentLavaY);c.fillStyle=rgb(40,10,8);c.fillRect(0,sly,WIDTH,HEIGHT-sly);c.fillStyle=rgb(240,110,30);for(let gx=0;gx<WIDTH;gx+=26){const w=Math.sin((gx+40)*0.15)*4;c.beginPath();c.arc(gx+13,sly+55+w,9,0,Math.PI*2);c.fill();}for(const p of platforms){const sy=worldToScreen(p.y);if(sy<-50||sy>HEIGHT+50)continue;const an=platformSpawnAnims.find(a=>a.plat===p);if(an){const pr=1-(an.frames/25);c.fillStyle=rgba(255,255,150,0.7*pr);c.fillRect(p.x-12+(1-pr)*12,sy-12+(1-pr)*12,p.w+24,p.h+24);}c.fillStyle=s.ground;c.fillRect(p.x,sy,p.w,p.h);c.fillStyle=s.ground_edge;c.fillRect(p.x,sy,p.w,10);} }

function drawHUD(c){const bw=Math.min(280,WIDTH*0.22),bh=22;const pos=[{x:20,y:20,a:'left'},{x:WIDTH-20-bw,y:20,a:'right'},{x:20,y:80,a:'left'},{x:WIDTH-20-bw,y:80,a:'right'}];for(let i=0;i<fighters.length;i++){const f=fighters[i],p=pos[i],r=f.health/MAX_HEALTH;c.fillStyle=BLACK;c.fillRect(p.x,p.y,bw,bh);c.fillStyle=r>0.5?GREEN:(r>0.25?YELLOW:RED);const fw=(bw-6)*r;c.fillRect(p.a==='left'?p.x+3:p.x+bw-3-fw,p.y+3,fw,bh-6);c.fillStyle=f.color;c.font="bold 14px Arial";c.textAlign=p.a;c.fillText(f.name,p.a==='left'?p.x:p.x+bw,p.y-4);const sr=f.super_charge/MAX_SUPER_CHARGE;c.fillStyle=BLACK;c.fillRect(p.x,p.y+bh+4,bw,8);if(sr>0){c.fillStyle=sr>=1?PURPLE:rgb(80,40,120);const sw=(bw-4)*sr;c.fillRect(p.a==='left'?p.x+2:p.x+bw-2-sw,p.y+bh+6,sw,4);}c.fillStyle=WHITE;c.font="bold 12px Arial";c.textAlign=p.a;c.fillText(`Wins: ${wins[i]}`,p.a==='left'?p.x:p.x+bw,p.y+bh+24);}c.fillStyle=WHITE;c.font="bold 24px Arial";c.textAlign="center";c.fillText(fighters.map(f=>f.health>0?"●":"○").join(" "),WIDTH/2,30);if(lavaRiseWarning>0&&Math.floor(lavaRiseWarning/5)%2===0){c.fillStyle=RED;c.font="bold 24px Arial";c.textAlign="center";c.fillText("WARNING: LAVA RISING!",WIDTH/2,HEIGHT/2-50);}if(radiationClouds.length>0&&!gameOver){c.fillStyle=TOXIC_GREEN;c.font="bold 14px Arial";c.textAlign="center";c.fillText("☢ TOXIC FALLOUT ACTIVE ☢",WIDTH/2,90);} }

function update() {
    if(state==="mode_select")return;
    if(state==="select"){if(p1Ready){selectConfirmTimer++;if(selectConfirmTimer>45){selectConfirmTimer=0;worldLocked=false;worldConfirmTimer=0;state="world_select";}}return;}
    if(state==="world_select"){if(worldLocked){worldConfirmTimer++;if(worldConfirmTimer>45){resetFighters();gameOver=false;winner=null;spawnTimer=WEAPON_SPAWN_INTERVAL;armorSpawnTimer=ARMOR_SPAWN_INTERVAL;fireballSpawnTimer=Math.random()*(FIREBALL_SPAWN_MAX-FIREBALL_SPAWN_MIN)+FIREBALL_SPAWN_MIN;worldConfirmTimer=0;state="playing";}}return;}
    if(!gameOver){
        for(let i=0;i<fighters.length;i++){if(fighters[i].isAI)updateAIFor(fighters[i],i-1);}
        for(let i=0;i<fighters.length;i++){fighters[i].handleInput(weapons,armors,arrows,bombs,fighters[i].isAI?aiKeysPool[i-1]:keys);}
        for(const f of fighters)f.physics();
        checkHits();checkAerialComboHits();updateArrows();

        // --- ASTEROID SPAWNING ---
        asteroidSpawnTimer--;
        if (asteroidSpawnTimer <= 0) {
            spawnAsteroidWave();
            asteroidSpawnTimer = Math.floor(Math.random() * (ASTEROID_SPAWN_MAX - ASTEROID_SPAWN_MIN)) + ASTEROID_SPAWN_MIN;
        }

        // Update warnings
        for (let i = asteroidWarnings.length - 1; i >= 0; i--) {
            if (!asteroidWarnings[i].update()) asteroidWarnings.splice(i, 1);
        }

        // Update asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            asteroids[i].update();
            if (asteroids[i].dead) asteroids.splice(i, 1);
        }

        // Update impacts
        for (let i = asteroidImpacts.length - 1; i >= 0; i--) {
            asteroidImpacts[i].update();
            if (asteroidImpacts[i].life <= 0) asteroidImpacts.splice(i, 1);
        }

        for(let i=superRays.length-1;i>=0;i--){superRays[i].update();if(superRays[i].life<=0)superRays.splice(i,1);}
        for(let i=bombs.length-1;i>=0;i--){bombs[i].update();if(bombs[i].exploded){const r=bombs[i].explode();if(bombs[i].isNuke){nukeExplosions.push(r[0]);radiationClouds.push(r[1]);}else explosions.push(r);bombs.splice(i,1);}}
        for(let i=explosions.length-1;i>=0;i--){explosions[i].update();if(explosions[i].life<=0)explosions.splice(i,1);}
        for(let i=nukeExplosions.length-1;i>=0;i--){nukeExplosions[i].update();if(nukeExplosions[i].life<=0)nukeExplosions.splice(i,1);}
        for(let i=radiationClouds.length-1;i>=0;i--){radiationClouds[i].update();if(radiationClouds[i].life<=0)radiationClouds.splice(i,1);}
        const stage=STAGES[stageIdx];
        if(stage.decor==="volcano"){fireballSpawnTimer--;if(fireballSpawnTimer<=0){spawnFireball();fireballSpawnTimer=Math.random()*(FIREBALL_SPAWN_MAX-FIREBALL_SPAWN_MIN)+FIREBALL_SPAWN_MIN;if(Math.random()<0.3)spawnFireball();}for(let i=fireballs.length-1;i>=0;i--){fireballs[i].update();if(fireballs[i].exploded){fireExplosions.push(fireballs[i].explode());fireballs.splice(i,1);}else if(fireballs[i].dead)fireballs.splice(i,1);}for(let i=fireExplosions.length-1;i>=0;i--){fireExplosions[i].update();if(fireExplosions[i].life<=0)fireExplosions.splice(i,1);}}
        for(let i=debris.length-1;i>=0;i--){debris[i].update();if(debris[i].life<=0)debris.splice(i,1);}
        for(let i=platformSpawnAnims.length-1;i>=0;i--){platformSpawnAnims[i].frames--;if(platformSpawnAnims[i].frames<=0)platformSpawnAnims.splice(i,1);}
        spawnTimer--;if(spawnTimer<=0){spawnWeapon();spawnTimer=WEAPON_SPAWN_INTERVAL;}
        armorSpawnTimer--;if(armorSpawnTimer<=0){spawnArmor();armorSpawnTimer=ARMOR_SPAWN_INTERVAL;}
        lavaRiseTimer--;if(lavaRiseTimer<=120)lavaRiseWarning=120;if(lavaRiseTimer<=0){currentLavaY-=LAVA_RISE_AMOUNT;if(currentLavaY<MIN_PLATFORM_Y-50)currentLavaY=MIN_PLATFORM_Y-50;lavaRiseTimer=LAVA_RISE_INTERVAL;sounds.hazard();generateNewPlatforms();}if(lavaRiseWarning>0)lavaRiseWarning--;
        updateCamera();updateScreenShake();
        for(let i=comboTexts.length-1;i>=0;i--){comboTexts[i].life--;comboTexts[i].y-=1;if(comboTexts[i].life<=0)comboTexts.splice(i,1);}
        for(let i=0;i<fighters.length;i++){for(let j=i+1;j<fighters.length;j++){const a=fighters[i],b=fighters[j];if(a.health<=0||b.health<=0)continue;if(rectIntersect(a.getRect(),b.getRect())){if(a.x<b.x){a.x-=1;b.x+=1;}else{a.x+=1;b.x-=1;}}}}
        const alive=fighters.filter(f=>f.health>0);
        if(alive.length<=1){gameOver=true;state="over";if(alive.length===1){winner=alive[0];wins[alive[0].playerIdx]++;}else winner=null;}
    }
}

function draw() {
    ctx.clearRect(0,0,WIDTH,HEIGHT);
    if(state==="mode_select"){ctx.fillStyle=rgb(20,20,30);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=YELLOW;ctx.font=`bold ${Math.min(48,WIDTH*0.04)}px Arial`;ctx.textAlign="center";ctx.fillText("SELECT GAME MODE",WIDTH/2,HEIGHT*0.2);const bw=Math.min(450,WIDTH*0.35),bh=70,sy=HEIGHT*0.32;for(let i=0;i<MODE_CHOICES.length;i++){const y=sy+i*(bh+20),is=i===modeIdx;ctx.fillStyle=is?rgba(240,200,40,0.2):rgba(255,255,255,0.05);ctx.fillRect(WIDTH/2-bw/2,y,bw,bh);ctx.strokeStyle=is?YELLOW:GRAY;ctx.lineWidth=is?4:2;ctx.strokeRect(WIDTH/2-bw/2,y,bw,bh);ctx.fillStyle=is?YELLOW:WHITE;ctx.font=`bold ${Math.min(28,WIDTH*0.022)}px Arial`;ctx.fillText(MODE_CHOICES[i],WIDTH/2,y+bh/2+8);if(is){ctx.fillText(">",WIDTH/2-bw/2-40,y+bh/2+10);ctx.fillText("<",WIDTH/2+bw/2+20,y+bh/2+10);}}ctx.fillStyle=GRAY;ctx.font=`${Math.min(18,WIDTH*0.014)}px Arial`;ctx.fillText("W/S or Up/Down to navigate, F/K/Enter/Space to confirm",WIDTH/2,HEIGHT*0.9);return;}
    if(state==="select"){ctx.fillStyle=rgb(20,20,20);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=WHITE;ctx.font=`bold ${Math.min(32,WIDTH*0.03)}px Arial`;ctx.textAlign="center";ctx.fillText("CHOOSE YOUR WEAPON",WIDTH/2,80);const cw=Math.min(100,(WIDTH-60)/WEAPON_CHOICES.length),sx=WIDTH/2-(WEAPON_CHOICES.length*cw)/2+cw/2;for(let i=0;i<WEAPON_CHOICES.length;i++){const cx=sx+i*cw;ctx.fillStyle=i===p1Idx?rgba(220,60,60,0.3):rgba(255,255,255,0.1);ctx.fillRect(cx-40,150,80,80);ctx.fillStyle=WHITE;ctx.font="14px Arial";ctx.fillText(WEAPON_CHOICES[i]?WEAPON_CHOICES[i].charAt(0).toUpperCase()+WEAPON_CHOICES[i].slice(1):"Fists",cx,200);if(i===p1Idx){ctx.fillStyle=RED;ctx.fillText("P1",cx,140);}}ctx.fillStyle=p1Ready?GREEN:RED;ctx.fillText(`Player 1: ${p1Ready?"READY!":"A/D choose, F to lock"}`,WIDTH/2,300);ctx.fillStyle=COMBO_ORANGE;ctx.font="bold 18px Arial";ctx.fillText("☄️ ASTEROIDS rain from the sky! Watch for warnings! ☄️",WIDTH/2,340);return;}
    if(state==="world_select"){drawBackground(ctx,STAGES[stageIdx]);ctx.fillStyle=rgba(0,0,0,0.7);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=WHITE;ctx.font=`bold ${Math.min(32,WIDTH*0.03)}px Arial`;ctx.textAlign="center";ctx.fillText("CHOOSE YOUR WORLD",WIDTH/2,80);ctx.fillStyle=YELLOW;ctx.font=`bold ${Math.min(24,WIDTH*0.025)}px Arial`;ctx.fillText(STAGES[stageIdx].name,WIDTH/2,140);ctx.fillStyle=WHITE;ctx.fillText("<",WIDTH/2-100,140);ctx.fillText(">",WIDTH/2+100,140);ctx.fillStyle=worldLocked?GREEN:WHITE;ctx.font="20px Arial";ctx.fillText(worldLocked?"READY!":"A/D or Arrows to browse, F or K to lock in",WIDTH/2,300);return;}

    ctx.save();ctx.translate(screenShakeX,screenShakeY);
    drawBackground(ctx,STAGES[stageIdx]);

    // --- Draw asteroid warnings ON the ground ---
    for (const w of asteroidWarnings) w.draw(ctx);

    for(const w of weapons)w.draw(ctx);for(const a of armors)a.draw(ctx);
    for(const f of fighters)f.draw(ctx);
    for(const a of arrows)a.draw(ctx);for(const b of bombs)b.draw(ctx);
    for(const e of explosions)e.draw(ctx);for(const e of nukeExplosions)e.draw(ctx);
    for(const r of radiationClouds)r.draw(ctx);
    for(const r of superRays)r.draw(ctx);

    // --- Draw asteroid impacts ---
    for (const imp of asteroidImpacts) imp.draw(ctx);

    // --- Draw asteroids ---
    for (const ast of asteroids) ast.draw(ctx);

    for(const f of fireballs)f.draw(ctx);for(const f of fireExplosions)f.draw(ctx);
    for(const d of debris)d.draw(ctx);
    for(const ct of comboTexts){const sy=worldToScreen(ct.y);const a=Math.min(1,ct.life/30);ctx.fillStyle=rgba(parseInt(ct.color.match(/\d+/g)[0]),parseInt(ct.color.match(/\d+/g)[1]),parseInt(ct.color.match(/\d+/g)[2]),a);ctx.font="bold 20px Arial";ctx.textAlign="center";ctx.fillText(ct.text,ct.x,sy);}
    ctx.restore();
    drawHUD(ctx);

    if(gameOver){ctx.fillStyle=rgba(0,0,0,0.7);ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle=YELLOW;ctx.font=`bold ${Math.min(48,WIDTH*0.05)}px Arial`;ctx.textAlign="center";ctx.fillText(winner?`${winner.name} WINS!`:"DRAW!",WIDTH/2,HEIGHT/2-40);ctx.fillStyle=WHITE;ctx.font="24px Arial";ctx.fillText("Press R to Return to Menu | ESC to Quit",WIDTH/2,HEIGHT/2+20);}
    else{ctx.fillStyle=rgba(40,40,40,0.8);ctx.font="14px Arial";ctx.textAlign="center";ctx.fillText("P1: A/D W F G SPACE(ray) Q(aerial) | ☄️ Dodge the ASTEROIDS! Watch for red warnings! ☄️",WIDTH/2,HEIGHT-15);}
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
resetFighters();
requestAnimationFrame(gameLoop);
</script>

</html>
